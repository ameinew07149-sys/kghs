<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3040 KGHS 投影牆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=Huninn&family=Josefin+Sans:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* 投影固定深色：暗底在宴會廳比較不刺眼，照片顏色也比較飽和 */
:root{
  --bg:#1C1724; --panel:#272033; --ink:#F7EEF6; --muted:#B4A8BF; --line:#3B3148;
  --pink:#FF8FAB; --pink-d:#F2668C; --lilac:#C9B6FF; --butter:#FFE08A; --mint:#9BE3C0; --sky:#A9D2FF;
  --round:"Huninn","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --cute:"Gaegu","Huninn","PingFang TC",sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"],:root[data-theme="dark"]{ color-scheme:dark; }
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--round);overflow:hidden;
  background-image:radial-gradient(circle at 10% 0%,rgba(255,143,171,.15),transparent 42%),radial-gradient(circle at 100% 100%,rgba(201,182,255,.13),transparent 45%)}
p,h1,h2{margin:0} h1,h2{font-weight:400}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:1.6vh;padding:2vh 2vw}

/* 上方 */
.top{display:flex;align-items:center;gap:2vw}
.brand{display:flex;align-items:baseline;gap:1vw}
.brand h1{font-size:clamp(20px,2.4vw,50px);letter-spacing:.06em}
.brand span{font-family:var(--cute);font-weight:700;font-size:clamp(16px,1.5vw,30px);color:var(--pink)}
.stats{margin-left:auto;display:flex;gap:.8vw}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:.6vh 1.1vw;font-size:clamp(12px,1.05vw,22px);color:var(--muted);white-space:nowrap}
.stat b{font-family:var(--cute);font-size:1.5em;color:var(--ink);margin-right:.2em}
.clock{font-family:var(--cute);font-weight:700;font-size:clamp(16px,1.7vw,34px);color:var(--muted)}
.stage{position:relative;min-height:0}

/* 卡片 */
.card{background:#fff;border-radius:6px;padding:.7vh .7vh 0;box-shadow:0 1.2vh 3vh rgba(0,0,0,.45);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.card .ph{flex:1;min-height:0;background:#F3EDF4;border-radius:3px;overflow:hidden;position:relative}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.card .cap{color:#3B3346;padding:.6vh .3vw .7vh;min-height:0}
.card .who{font-size:clamp(10px,.95vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .who em{font-style:normal;color:#A2849A;margin-left:.4em}
.card .say{font-size:clamp(10px,.85vw,18px);color:#6B6176;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .say img{height:1.6em;vertical-align:middle}

/* 模式一：拼貼照片牆（照片直接貼在牆上，依照片比例佔不同大小） */
.stage{background:
  radial-gradient(circle at 1px 1px,rgba(255,255,255,.05) 1px,transparent 1.5px) 0 0/14px 14px,
  linear-gradient(180deg,#2A2233,#221B2B);border-radius:18px}
.collage{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-auto-rows:var(--u);grid-auto-flow:row dense;padding:calc(var(--u)*.35);overflow:hidden}
.tile2{position:relative;padding:calc(var(--u)*.22);min-width:0;min-height:0;perspective:1200px}
.tile2 .pic{position:relative;width:100%;height:100%;transition:transform .35s ease-in}
.tile2 .pic img{display:block;width:100%;height:100%;object-fit:cover;box-shadow:0 .9vh 2.4vh rgba(0,0,0,.5),0 .2vh .5vh rgba(0,0,0,.3)}
.tile2 .pic::before{content:"";position:absolute;z-index:2;top:-.9vh;left:50%;width:34%;max-width:110px;height:2.4vh;transform:translateX(-50%) rotate(var(--tape,-4deg));background:rgba(255,248,230,.55);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tile2 .pic.out{transform:rotateY(90deg)}
.tile2 .pic.in{animation:flipin .45s ease-out}
@keyframes flipin{from{transform:rotateY(-90deg)}to{transform:none}}
.tile2 .tag{position:absolute;z-index:3;left:6%;bottom:-1.2vh;max-width:88%;background:#FFFDF7;color:#3B3346;padding:.5vh .8vw;font-size:clamp(10px,.85vw,18px);line-height:1.45;box-shadow:0 .4vh 1vh rgba(0,0,0,.35);rotate:-1.5deg;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile2 .tag b{font-weight:400;color:#A2849A;margin-left:.4em}
.tile2 .tag.work{color:#6E4FB8}
.tile2[data-shape="sq"] .pic::before{display:none}
/* 放大特寫 */
.spot{position:fixed;inset:0;z-index:4;display:grid;place-items:center;background:rgba(18,13,24,.72);opacity:0;pointer-events:none;transition:opacity .5s}
.spot.show{opacity:1}
.spot .inner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3.5vw;align-items:center;max-width:88vw;transform:scale(.92);transition:transform .6s cubic-bezier(.2,.9,.3,1.2)}
.spot.show .inner{transform:none}
.spot .big{background:#fff;padding:1vh;border-radius:6px;box-shadow:0 2vh 6vh rgba(0,0,0,.6);rotate:-2deg}
.spot .big img{display:block;max-height:70vh;max-width:44vw;border-radius:3px}
.spot .words{max-width:40vw}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-block;background:var(--pink);color:#fff;border-radius:999px;padding:.5vh 1.2vw;font-size:clamp(12px,1.2vw,24px);margin-bottom:2.4vh}
.spot .msg{font-size:clamp(22px,3.2vw,68px);line-height:1.45}
.spot .hand{display:block;max-width:100%;max-height:30vh}
.spot .ttl{font-size:clamp(24px,3.6vw,76px);line-height:1.3;margin-bottom:2vh}
.spot .msg.small{font-size:clamp(18px,2.2vw,46px);color:#E9DCEA}
.chip.work{background:var(--lilac);color:#2E2346}
.card .work{color:#7A5CC0}
.notecard{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:3% 4%}
.note{position:relative;width:100%;height:100%;max-height:100%;padding:12% 10% 9%;display:flex;flex-direction:column;justify-content:center;gap:6%;box-shadow:0 1.2vh 3vh rgba(0,0,0,.45);color:#3B3346}
.note::before{content:"";position:absolute;top:-4%;left:50%;width:38%;height:9%;transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.6)}
.note .nt{font-size:clamp(12px,1.25vw,26px);line-height:1.6;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical}
.note .sig{font-family:var(--cute);font-weight:700;font-size:clamp(10px,.95vw,20px);text-align:right}
.note.big{width:min(46vw,70vh);height:min(46vw,70vh);rotate:-2deg;padding:9% 9% 7%}
.note.big .nt{font-size:clamp(20px,3vw,60px);-webkit-line-clamp:6}
.note.big .sig{font-size:clamp(16px,1.8vw,36px)}
.chip.notechip{background:var(--butter);color:#4A3A10}
.noteimg{display:block;max-width:100%;max-height:100%;aspect-ratio:1;object-fit:contain;box-shadow:0 1.2vh 3vh rgba(0,0,0,.45);border-radius:2px}
.slot:nth-child(odd) .noteimg{rotate:-2deg} .slot:nth-child(even) .noteimg{rotate:1.6deg}
.noteimg.big{width:min(46vw,70vh);height:auto;max-height:none;rotate:-2deg}
.slot:nth-child(4n+1) .notecard .note{rotate:-2deg} .slot:nth-child(4n+2) .notecard .note{rotate:1.6deg}
.spot .by{margin-top:3vh;font-size:clamp(14px,1.6vw,32px);color:var(--muted)}
.spot .by b{color:var(--ink);font-weight:400}

/* 模式二：五個祕境 */
.cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:1.4vw}
.col{display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.col h2{font-size:clamp(14px,1.45vw,30px);text-align:center;padding:1.2vh .5vw .4vh}
.col .n{display:block;text-align:center;font-family:var(--cute);font-weight:700;color:var(--pink);font-size:clamp(12px,1.1vw,22px);padding-bottom:.8vh}
.col .win{flex:1;min-height:0;overflow:hidden;mask-image:linear-gradient(transparent,#000 5%,#000 95%,transparent)}
.col .track{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh .7vw;padding:1.4vh .8vw;will-change:transform}
.col .card .say{display:none}
.col .card .ph{aspect-ratio:4/5;flex:none}

/* 大結局 */
.finale{position:fixed;inset:0;z-index:6;background:#120E18;overflow:hidden}
.finale .line{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(24px,3.6vw,76px);line-height:1.6;opacity:0;transition:opacity 1.2s}
.finale .line.show{opacity:1}
.finale .line small{display:block;font-family:var(--cute);font-weight:700;color:var(--pink);font-size:.55em}
.tile{position:absolute;left:0;top:0;background:#fff;padding:2px;border-radius:2px;box-shadow:0 2px 6px rgba(0,0,0,.4);transition:transform 2.4s cubic-bezier(.2,.8,.2,1),opacity 1.2s}
.tile img{display:block;width:100%;height:100%;object-fit:cover}
.bigstats{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:6vw;opacity:0;transition:opacity 1s;background:rgba(18,14,24,.6)}
.bigstats.show{opacity:1}
.bigstats div{text-align:center}
.bigstats b{display:block;font-family:var(--cute);font-weight:700;font-size:clamp(48px,9vw,190px);color:var(--pink);line-height:1}
.bigstats span{font-size:clamp(16px,1.8vw,38px);color:var(--muted)}
.bubble{position:absolute;bottom:-16vh;max-width:18vw;background:#fff;color:#3B3346;border-radius:22px;padding:1.2vh 1.4vw;font-size:clamp(14px,1.6vw,32px);line-height:1.5;box-shadow:0 1vh 3vh rgba(0,0,0,.4);animation:rise linear forwards}
.bubble i{display:block;font-style:normal;font-size:.62em;color:#A2849A;margin-top:.4vh}
.bubble img{display:block;max-width:100%;max-height:12vh}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-130vh)}}

.notice{position:fixed;left:50%;top:10vh;transform:translate(-50%,-40vh);background:var(--butter);color:#4A3A10;border-radius:999px;padding:1.2vh 2.4vw;font-size:clamp(14px,1.6vw,32px);box-shadow:0 1vh 3vh rgba(0,0,0,.4);transition:transform .6s cubic-bezier(.2,.9,.3,1.3);z-index:7;white-space:nowrap}
.notice.show{transform:translate(-50%,0)}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:clamp(18px,2.4vw,44px);line-height:1.8}

/* 控制列 */
.ctl{position:fixed;left:50%;bottom:calc(2vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;background:rgba(20,16,28,.94);border:1px solid var(--line);border-radius:18px;padding:10px;z-index:9;opacity:0;pointer-events:none;transition:opacity .3s;max-width:calc(100% - 24px)}
.ctl.show{opacity:1;pointer-events:auto}
.ctl button{border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;border-radius:12px;padding:8px 12px;cursor:pointer}
.ctl button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff}
.ctl .finbtn{background:var(--butter);color:#4A3A10;border-color:var(--butter)}
button:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:10}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(420px,90vw)}
.sheet h2{font-size:22px;margin-bottom:12px}
.sheet input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.sheet .row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
.sheet button{border:0;border-radius:12px;padding:10px 16px;font:inherit;cursor:pointer;background:var(--pink);color:#fff}
.sheet button.soft{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;max-height:50vh;overflow:auto;margin-top:8px}
.picker button{padding:0;border:2px solid transparent;background:none;border-radius:8px;cursor:pointer}
.picker img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px}
/* ===================== 頒獎典禮視覺（覆蓋上方配色） ===================== */
:root{
  --bg:#120F0D; --panel:#1E1916; --ink:#F3EADB; --muted:#A39279; --line:#3A302A;
  --gold:#D4B26A; --gold-hi:#E9CF8F; --velvet:#8E1E2E;
  --pink:var(--gold); --pink-d:#B8944E; --lilac:#E9CF8F; --butter:#F1E2B8;
  --serif:"Noto Serif TC","Noto Serif CJK TC","Songti TC","PMingLiU",serif;
  --round:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --cute:var(--serif);
}
body{background-image:radial-gradient(ellipse 60% 40% at 50% -8%,rgba(212,178,106,.20),transparent 70%),radial-gradient(ellipse 50% 50% at 100% 110%,rgba(142,30,46,.22),transparent 70%)}
.brand h1{font-family:var(--serif);font-weight:900;color:var(--ink)}
.brand span{font-family:var(--serif);font-weight:600;color:var(--gold);letter-spacing:.2em}
.stat{border-color:rgba(212,178,106,.35)}
.stat b{font-family:var(--serif);font-weight:900;color:var(--gold-hi)}
.clock{font-family:var(--serif);color:var(--gold)}
.stage{background:radial-gradient(circle at 1px 1px,rgba(212,178,106,.06) 1px,transparent 1.5px) 0 0/14px 14px,linear-gradient(180deg,#1C1714,#141110);
  box-shadow:inset 0 0 0 1px rgba(212,178,106,.28)}
.tile2 .pic::before{background:rgba(233,207,143,.5)}
.tile2 .tag{background:#F6EEDF;color:#1E1915}
.card{background:#F6EEDF}.card .ph{background:#E9DFCF}.card .who em{color:#8E6C34}
.tile2 .tag b{color:#8E6C34}
.tile2 .tag.work{color:#8E1E2E}
.spot{background:radial-gradient(ellipse 50% 60% at 50% 30%,rgba(212,178,106,.16),transparent 70%),rgba(10,8,7,.86)}
.spot .big{background:#0B0908;box-shadow:0 0 0 2px var(--gold),0 0 0 10px #0B0908,0 0 0 11px rgba(212,178,106,.5),0 2vh 6vh rgba(0,0,0,.7);rotate:0deg}
.chip{background:transparent;color:var(--gold-hi);border:2px solid var(--gold);border-radius:4px;font-family:var(--serif);font-weight:600;letter-spacing:.08em}
.chip.work{background:transparent;color:var(--gold-hi)}
.chip.notechip{background:var(--butter);color:#3A2A10;border-color:var(--butter)}
.spot .where{color:var(--muted);font-size:clamp(14px,1.4vw,28px);margin:-1.2vh 0 2.4vh}
.spot .msg,.spot .ttl{font-family:var(--serif);font-weight:600}
.spot .msg.small{color:#E5D9C4}
.col{border-color:rgba(212,178,106,.28);background:rgba(212,178,106,.03)}
.col .aw{text-align:center;font-family:var(--serif);font-weight:600;color:var(--gold);font-size:clamp(12px,1.05vw,22px);padding-top:1.4vh;letter-spacing:.06em}
.col h2{font-family:var(--serif);font-weight:600;padding-top:.3vh}
.col .n{font-family:var(--round);font-weight:500;color:var(--muted)}
.finale{background:#0B0908}
.finale .line{font-family:var(--serif);font-weight:900;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center}
.finale .line small{font-family:var(--serif);font-weight:600;color:var(--gold);letter-spacing:.3em;margin-top:1vh}
.tile{background:#0B0908;box-shadow:0 0 0 1px rgba(212,178,106,.4)}
.bigstats{background:rgba(11,9,8,.86)}
.bigstats{gap:4.5vw}.bigstats b{font-family:var(--serif);font-weight:900;color:var(--gold-hi);font-size:clamp(40px,6.4vw,140px);margin-bottom:1.4vh}.bigstats span{white-space:nowrap;font-size:clamp(14px,1.5vw,32px)}
.bubble{background:#F6EEDF;color:#1E1915;border-radius:6px;font-family:var(--serif);font-weight:600}
.bubble i{font-family:var(--round);font-weight:500;color:#8E6C34}
.credits{position:absolute;inset:0;overflow:hidden;mask-image:linear-gradient(transparent,#000 14%,#000 86%,transparent)}
.credits .roll{position:absolute;left:0;right:0;top:100%;text-align:center;padding:0 10vw}
.credits h2{font-family:var(--serif);font-weight:900;color:var(--gold-hi);font-size:clamp(28px,4vw,84px);letter-spacing:.2em;margin-bottom:4vh}
.credits .awline{font-family:var(--serif);font-weight:600;color:var(--gold);font-size:clamp(16px,1.8vw,38px);line-height:1.9}
.credits .gap{height:8vh}
.credits section{margin-bottom:6vh}
.credits h3{font-family:var(--serif);font-weight:600;color:var(--gold);font-size:clamp(16px,1.7vw,36px);letter-spacing:.2em;margin:0 0 1.6vh}
.credits section p{font-family:var(--serif);font-weight:600;color:var(--ink);font-size:clamp(20px,2.4vw,52px);line-height:1.8;max-width:70vw;margin:0 auto}
@keyframes credits{from{transform:translateY(0)}to{transform:translateY(calc(var(--to) - 100vh))}}
.notice{background:var(--gold);color:#1E1610}
.ctl{background:rgba(18,15,13,.95)}
.ctl button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1E1610}
.ctl .finbtn{background:var(--velvet);color:#F6EBD6;border-color:var(--velvet)}
.sheet button{background:var(--velvet);color:#F6EBD6}
button:focus-visible{outline-color:var(--gold-hi)}
@media (prefers-reduced-motion:reduce){.slot .card,.spot,.spot .inner,.tile,.notice{transition:none}.slot .card.in{animation:none}}
/* ===================== 3040 KGHS 主視覺：黑金裝飾藝術風（Art Deco） ===================== */
:root{ --gold-grad:linear-gradient(100deg,#9C7634 0%,#F6E3AE 24%,#C9A158 44%,#FFF1C9 56%,#B88A3E 74%,#E9CF8F 100%);
  --deco:"Josefin Sans","Noto Sans TC",sans-serif; --script:"Great Vibes",cursive; --bar:4.2vh; }
body{background:#1A1816;background-image:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(212,178,106,.10),transparent 70%)}
/* 上下兩條金色琴鍵飾帶 */
.deco{position:fixed;left:0;right:0;height:var(--bar);z-index:1;pointer-events:none;
  background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='132' height='60' viewBox='0 0 132 60'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%236E5226'/%3E%3Cstop offset='.45' stop-color='%23EAD3A0'/%3E%3Cstop offset='1' stop-color='%239A7738'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg fill='url(%23g)'%3E%3Crect x='3' y='6' width='12' height='50' rx='3'/%3E%3Crect x='19' y='6' width='10' height='50' rx='3'/%3E%3Crect x='33' y='6' width='7' height='50' rx='2'/%3E%3Crect x='44' y='6' width='4' height='50' rx='1'/%3E%3Crect x='53' y='4' width='1.4' height='54'/%3E%3Crect x='77.6' y='4' width='1.4' height='54'/%3E%3Crect x='84' y='6' width='4' height='50' rx='1'/%3E%3Crect x='92' y='6' width='7' height='50' rx='2'/%3E%3Crect x='103' y='6' width='10' height='50' rx='3'/%3E%3Crect x='117' y='6' width='12' height='50' rx='3'/%3E%3C/g%3E%3C/svg%3E") center/auto 72% repeat-x;
  border-color:rgba(212,178,106,.7);border-style:solid;border-width:0}
.deco.top-bars{top:0;border-bottom-width:1px;box-shadow:0 .6vh 0 -.45vh rgba(212,178,106,.45)}
.deco.bot-bars{bottom:0;border-top-width:1px;box-shadow:0 -.6vh 0 -.45vh rgba(212,178,106,.45)}
.app{padding:calc(var(--bar) + 1.4vh) 2.4vw calc(var(--bar) + 1.4vh);gap:1.4vh}
/* 標題：校徽＋3040 KGHS */
.top{gap:1.4vw}
.logo{height:clamp(40px,6.6vh,96px);width:auto;filter:drop-shadow(0 .4vh 1vh rgba(0,0,0,.5))}
.brand{display:flex;flex-direction:column;gap:.3vh;align-items:flex-start}
.brand .kg{font-family:var(--deco);font-weight:400;font-size:clamp(14px,1.7vw,36px);letter-spacing:.14em;line-height:1;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand .kg i{font-family:var(--script);font-style:normal;letter-spacing:0;font-size:1.05em;margin-left:.5em}
.brand h1{font-family:var(--serif);font-weight:600;font-size:clamp(16px,1.9vw,40px);letter-spacing:.42em;line-height:1.2;color:#F3EADB;
  padding:.4vh 0;border-top:1px solid rgba(212,178,106,.7);border-bottom:1px solid rgba(212,178,106,.7)}
.stat{background:rgba(212,178,106,.06);border-color:rgba(212,178,106,.45);border-radius:2px;font-family:var(--serif);letter-spacing:.06em}
.stat b{font-family:var(--deco);font-weight:600;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.clock{font-family:var(--deco);font-weight:300;letter-spacing:.12em;color:var(--gold-hi)}
/* 舞台：雙金框＋四角放射扇形 */
.stage{border-radius:0;background:#1B1917;
  box-shadow:inset 0 0 0 1px rgba(212,178,106,.75),inset 0 0 0 6px #1B1917,inset 0 0 0 7px rgba(212,178,106,.35)}
.stage::before,.stage::after{content:"";position:absolute;z-index:2;width:6.4vh;height:6.4vh;pointer-events:none;
  background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Cg fill='none' stroke='%23D4B26A' stroke-width='1.2'%3E%3Cpath d='M2 2H40M2 2V40M8 8H28V12H12V28H8Z'/%3E%3Cpath d='M58 2A26 26 0 0 1 32 28' /%3E%3C/g%3E%3Cg stroke='%23D4B26A' stroke-width='.8'%3E%3Cpath d='M46 2l-2 14M50 2l0 15M54 2l3 14M42 2l-5 12M38 2l-8 9'/%3E%3C/g%3E%3C/svg%3E") 0 0/100% 100% no-repeat}
.stage::before{top:.4vh;left:.4vh}
.stage::after{bottom:.4vh;right:.4vh;transform:rotate(180deg)}
.collage{padding:calc(var(--u)*.35 + 1vh)}
.cols{inset:1.6vh}
.col{border-radius:2px;border-color:rgba(212,178,106,.4)}
.col .aw{font-family:var(--serif)}
.chip{border-radius:2px}
.notice{border-radius:2px;background:var(--gold-grad);color:#1E1610;font-family:var(--serif);font-weight:600}
/* 還沒有照片：用 PPT 背板當待機畫面 */
.empty{background:#1A1816 url("assets/brand/backplate.jpg") center/contain no-repeat;color:#E9CF8F;font-family:var(--serif);font-size:clamp(14px,1.6vw,32px);padding:22vh 24% 0}
.card .work{color:#8E1E2E}
/* 大結局開場與謝幕：主視覺 */
.kv{position:absolute;inset:0;background:#000 url("assets/brand/key-visual.jpg") center/contain no-repeat;opacity:0;transition:opacity 1.4s}
.kv.show{opacity:1}
.finale .line small{font-family:var(--deco);font-weight:400;letter-spacing:.3em}
.credits h2{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
@media (prefers-reduced-motion:reduce){.kv{transition:none}}
/* 投影模式：沒有游標、沒有按鈕 */
body.display,body.display *{cursor:none!important}
body.display .ctl{display:none!important}
.standby{position:fixed;inset:0;z-index:8;background:#000 url("assets/brand/key-visual.jpg") center/contain no-repeat}
.fshint{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);z-index:12;background:rgba(12,10,9,.9);color:#F3EADB;border:1px solid var(--gold);padding:1.4vh 2.4vw;font-family:var(--serif);font-size:clamp(14px,1.4vw,28px);transition:opacity 1s}
.fshint b{color:var(--gold-hi);font-weight:900}
.fshint.dim{opacity:.25}
</style>

<body>
<div class="deco top-bars" aria-hidden="true"></div><div class="deco bot-bars" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <img class="logo" src="assets/brand/logo-gold.png" alt="高雄女中">
    <div class="brand"><p class="kg">3040 KGHS <i>Alumni Reunion Party</i></p><h1>高雄女中校友重聚</h1></div>
    <div class="stats" id="stats"></div>
    <div class="clock" id="clock"></div>
  </header>
  <main class="stage" id="stage"></main>
</div>

<div class="spot" id="spot"><div class="inner" id="spotInner"></div></div>
<div class="finale" id="finale" hidden></div>
<div class="notice" id="notice" role="status" aria-live="polite"></div>

<div class="ctl" id="ctl">
  <button data-mode="grid">照片牆</button>
  <button data-mode="cols">五個祕境</button>
  <button data-k="pause" id="bPause">暫停</button>
  <button data-k="feature">放大一張</button>
  <button data-k="hide">隱藏照片</button>
  <button data-k="full">全螢幕</button>
  <button data-k="finale" class="finbtn">播放大結局</button>
</div>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div class="standby" id="standby" hidden></div>
<div class="fshint" id="fsHint" hidden>在這個畫面<b>點兩下</b>（或按 <b>F</b>）進入全螢幕</div>

<script>
/* ===================== 設定（要和玩家頁的 CONFIG 一致） ===================== */
const CONFIG = {
  // 和玩家頁同一組 firebaseConfig；一定要填，沒填投影牆不會顯示照片
  firebase: { apiKey:'AIzaSyAupt9BRdUa4mIVZKWDD9nClUHG2MzPBfc', authDomain:'kghs-reunion.firebaseapp.com', projectId:'kghs-reunion', storageBucket:'kghs-reunion.firebasestorage.app', messagingSenderId:'112353723139', appId:'1:112353723139:web:2a9a50e0afe095da21df36', measurementId:'G-FCD8PZH2V3' },
  // 後台管理員帳號（在 Firebase 主控台 → Authentication 建立的那個 Email）；隱藏照片時要輸入它的密碼
  adminEmail: 'ameinew07149@gmail.com',
  spots: [
    { id:'s1', name:'校門口', award:'最佳時光獎' }, { id:'s2', name:'榕園', award:'最佳夢想獎' }, { id:'s3', name:'圖書館', award:'最佳書香獎' },
    { id:'s4', name:'學生活動中心', award:'最佳人氣獎' }, { id:'s5', name:'體育館', award:'最佳青春熱血獎' }
  ],
  swapSeconds: 2.5,       // 照片牆：每幾秒換掉一格
  featureSeconds: 18,     // 照片牆：每幾秒放大一張特寫（0＝不放大）
  finale: {               // 大結局的文字（開場前與謝幕後會播放主視覺 assets/brand/key-visual.jpg）
    opening: '今天，我們一起回到了雄女',
    openingSub: '三十而遇　四十重聚',
    creditsTitle: '本屆得獎名單',
    closing: '歡迎回家',
    closingSub: '3040 KGHS　高雄女中校友重聚'
  }
};

const $=s=>document.querySelector(s);
const esc=s=>String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const spotName=id=>(CONFIG.spots.find(s=>s.id===id)||{}).name||'';
const spotAward=id=>(CONFIG.spots.find(s=>s.id===id)||{}).award||'';
const ICONS={
  camera:'<path d="M4 8.5A2 2 0 0 1 6 6.5h2l1.5-2h5l1.5 2h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/>',
  note:'<path d="M5 4h14v10.5L13.5 20H5z"/><path d="M13.5 20v-5.5H19"/><path d="M8.5 8.5h7"/><path d="M8.5 11.5h4"/>',
  hourglass:'<path d="M7 3.5h10"/><path d="M7 20.5h10"/><path d="M8 3.5c0 4.5 4 5.5 4 8.5s-4 4-4 8.5"/><path d="M16 3.5c0 4.5-4 5.5-4 8.5s4 4 4 8.5"/>',
  sparkle:'<path d="M12 3.5c.6 4.2 2.3 5.9 6.5 6.5-4.2.6-5.9 2.3-6.5 6.5-.6-4.2-2.3-5.9-6.5-6.5 4.2-.6 5.9-2.3 6.5-6.5z"/>'
};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LIVE=!!(CONFIG.firebase && CONFIG.firebase.apiKey);
const shuffle=a=>{ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

let all=[], items=[], mode='grid', paused=false, inFinale=false, standby=false;
/* 投影模式（wall.html?display=1）：畫面上不出現任何按鈕，全部由控制台 control.html 操作 */
const DISPLAY=new URLSearchParams(location.search).get('display')==='1';
const WF={ spot:'all', kind:'all' };
const match=it=>(WF.spot==='all'||it.spot===WF.spot)&&(WF.kind==='all'||it.kind===WF.kind);
function refilter(){ items=all.filter(match); }

/* ===================== 資料來源 ===================== */
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
const FBV='10.12.2'; let FB=null;
async function fb(){
  if(FB) return FB;
  for(const m of ['app','firestore','auth']) if(!(window.firebase && (m==='app' || firebase[m]))) await loadScript(`https://cdn.jsdelivr.net/npm/firebase@${FBV}/firebase-${m}-compat.js`);
  const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(CONFIG.firebase);
  FB={ db:app.firestore(), auth:app.auth() };
  return FB;
}
function docToItem(id,e){
  return { id, name:e.name, cls:e.cls, spot:e.spot, msg:e.msg||'', kind:e.kind||'selfie', title:e.title||'', layout:e.layout||'single',
    color:(e.layout||'').startsWith('note-')?e.layout.slice(5):'yellow', img:e.wallUrl||e.photoUrl, full:e.photoUrl, tiny:e.tinyUrl||e.wallUrl||e.photoUrl, hand:e.handUrl||null, t:e.t||Date.now() };
}
/* 即時監聽：第一次收到全部照片；之後有人上傳／重拍／被隱藏，都會即時推過來（斷線會自動重連） */
let firstSnap=true;
async function subscribe(){
  if(!LIVE) return;
  const { db }=await fb();
  return new Promise(res=>{
    db.collection('entries').where('hidden','==',false).onSnapshot(snap=>{
      if(firstSnap){
        firstSnap=false;
        all=snap.docs.map(d=>docToItem(d.id,d.data())).sort((a,b)=>b.t-a.t); refilter();
        renderStats(); setMode(mode); preload(all); res(); sendState(); return;
      }
      snap.docChanges().forEach(ch=>{
        if(ch.type==='removed') removeItem(ch.doc.id);
        else addItem(docToItem(ch.doc.id, ch.doc.data()));
      });
    }, err=>{ notice('即時連線中斷，正在重新連線…'); setTimeout(()=>{ firstSnap=true; subscribe(); }, 5000); res(); });
  });
}
function addItem(it){
  if(LIVE) preload([it]);
  const existed=all.some(x=>x.id===it.id);
  all=all.filter(x=>x.id!==it.id); all.unshift(it); refilter();
  renderStats(); sendState(); if(inFinale || !match(it)) return;
  notice(`第 ${it.cls} 屆 ${it.name} 剛剛在「${spotName(it.spot)}」${existed?'重拍了一張':'集章'}！`);
  if(mode==='grid'){ const n=document.querySelectorAll('.tile2').length; if(n<items.length && n<GRID.cap) renderGrid(); else placeNew(it); feature(it); }
  else renderCols();
}
function removeItem(id){
  if($('#spot').classList.contains('show') && $('#spot').dataset.id===id) $('#spot').classList.remove('show');
  all=all.filter(x=>x.id!==id); refilter(); renderStats(); sendState();
  if(mode==='grid'){ document.querySelectorAll(`.tile2[data-id="${CSS.escape(id)}"]`).forEach(t=>swapSlot(t)); }
  else renderCols();
}

/* ===================== 共用畫面 ===================== */
const NOTE_BG={ yellow:'#FFF1A8', pink:'#FFD6E2', blue:'#D9EAFF', green:'#DDF3D3' }, NOTE_AC={ yellow:'#A9861A', pink:'#C2456B', blue:'#3B6FB6', green:'#3E8A4E' };
function noteHTML(it,big){
  if(it.img) return `<img class="noteimg ${big?'big':''}" src="${it.img}" alt="${esc(it.name)}的便利貼">`;
  const c=it.color||'yellow';
  return `<div class="note ${big?'big':''}" style="background:${NOTE_BG[c]||NOTE_BG.yellow}"><p class="nt">${esc(it.msg)}</p><p class="sig" style="color:${NOTE_AC[c]||NOTE_AC.yellow}">— ${esc(it.name)}（第 ${esc(it.cls)} 屆）</p></div>`;
}
function cardHTML(it){
  if(it.kind==='note') return `<div class="notecard">${noteHTML(it)}</div>`;
  const say = it.hand ? `<img src="${it.hand}" alt="手寫留言">` : esc(it.msg);
  const scene=it.kind==='scene';
  const head = scene ? `<p class="who work">${ic('camera')} ${it.title?`《${esc(it.title)}》`:esc(spotName(it.spot))}</p><p class="who">攝影｜${esc(it.name)}<em>第 ${esc(it.cls)} 屆</em></p>`
                     : `<p class="who">${esc(it.name)}<em>第 ${esc(it.cls)} 屆・${esc(spotName(it.spot))}</em></p>`;
  return `<div class="card ${scene?'scene':''}"><div class="ph"><img src="${it.img}" alt="" loading="lazy"></div><div class="cap">${head}${it.msg||it.hand?`<p class="say">${say}</p>`:''}</div></div>`;
}
function people(){ const m=new Map(); all.forEach(x=>{ const k=x.cls+'|'+x.name; m.set(k,(m.get(k)||new Set()).add(x.spot)); }); return m; }
function renderStats(){
  const m=people(), done=[...m.values()].filter(s=>s.size>=CONFIG.spots.length).length;
  const pl = PRE.total && PRE.done<PRE.total ? `<span class="stat" title="背景預先載入照片">${ic('hourglass')} 預載 <b>${PRE.done}</b>/ ${PRE.total}</span>` : '';
  $('#stats').innerHTML=`${pl}<span class="stat"><b>${m.size}</b>位校友參加</span><span class="stat"><b>${done}</b>位摘齊五星</span><span class="stat"><b>${all.length}</b>張照片</span>`;
}
/* 預先載入：開頁後在背景把所有照片的牆面版與小圖下載好（同時 6 張），播放時就不會出現空格。
   載入過的圖片瀏覽器會快取，之後輪播不再耗流量。 */
const PRE={ seen:new Set(), queue:[], running:0, done:0, total:0, keep:[] };
function preload(list){
  list.forEach(it=>[it.img,it.tiny].forEach(u=>{ if(u && !PRE.seen.has(u)){ PRE.seen.add(u); PRE.queue.push(u); PRE.total++; } }));
  pump(); renderStats();
}
function pump(){
  while(PRE.running<6 && PRE.queue.length){
    const u=PRE.queue.shift(); PRE.running++;
    const im=new Image(); im.decoding='async';
    const fin=()=>{ PRE.running--; PRE.done++; if(PRE.done%10===0 || PRE.done===PRE.total) renderStats(); pump(); };
    im.onload=fin; im.onerror=fin; im.src=u;
  }
}
let noticeTimer=null;
function notice(t){ const n=$('#notice'); n.innerHTML=ic('sparkle')+' '+esc(t); n.classList.add('show'); clearTimeout(noticeTimer); noticeTimer=setTimeout(()=>n.classList.remove('show'),5000); }
function tick(){ const d=new Date(); $('#clock').textContent=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

/* ===================== 模式一：拼貼照片牆 =====================
   每張照片依原本比例佔不同大小：單張 4×5、四格方格 4×6、四格直條 2×6（四格完整呈現）、便利貼 4×4。
   輪替時只和「同形狀」的照片交換，牆面排版不會亂掉。 */
const SHAPES={ port:[4,5], tall:[4,6], strip:[2,6], sq:[4,4] };
function shapeOf(it){
  const l=it.layout||'';
  if(it.kind==='note' || l.startsWith('note')) return 'sq';
  if(l==='strip') return 'strip';
  if(l==='grid') return 'tall';
  return 'port';
}
const GRID={ queues:{}, swapT:null, featT:null, cap:99 };
function onWall(){ return new Set([...document.querySelectorAll('.tile2')].map(t=>t.dataset.id)); }
function nextOfShape(shape){
  const used=onWall(), pool=items.filter(x=>shapeOf(x)===shape);
  for(let pass=0; pass<2; pass++){
    const q=GRID.queues[shape]||(GRID.queues[shape]=[]);
    while(q.length){ const it=q.shift(); if(items.includes(it) && !used.has(it.id)) return it; }
    GRID.queues[shape]=shuffle(pool);
  }
  return null;
}
function tileInner(it){
  const tag = it.kind==='note' ? '' :
    shapeOf(it)==='strip' ? '' :
    it.kind==='scene' ? (it.msg ? `<p class="tag work">${ic('camera')} 「${esc(it.msg)}」</p>` : '') :
    (it.msg ? `<p class="tag">「${esc(it.msg)}」<b>${esc(it.name)}</b></p>` : '');
  return `<div class="pic"><img src="${it.img}" alt="${esc(it.name)}的照片" loading="lazy"></div>${tag}`;
}
function tileHTML(it){
  const [c,r]=SHAPES[shapeOf(it)], rot=((Math.random()-.5)*5).toFixed(1), tape=((Math.random()-.5)*12).toFixed(0);
  return `<div class="tile2" data-id="${esc(it.id)}" data-shape="${shapeOf(it)}" style="grid-column:span ${c};grid-row:span ${r};rotate:${rot}deg;--tape:${tape}deg">${tileInner(it)}</div>`;
}
function renderGrid(){
  clearInterval(GRID.swapT); clearInterval(GRID.featT);
  if(!items.length){ $('#stage').innerHTML = all.length ? '<p class="empty">這個篩選目前沒有照片。</p>' : '<p class="empty">還沒有照片。<br>校友們集章後，照片和留言會出現在這裡。</p>'; return; }
  const st=$('#stage'), W=st.clientWidth, H=st.clientHeight;
  const cols = W/H>1.4 ? 32 : 20, u=W/(cols+0.7);
  GRID.queues={};
  st.innerHTML=`<div class="collage" style="--cols:${cols};--u:${u}px"></div>`;
  const wall=st.querySelector('.collage'), box=st.getBoundingClientRect(), limit=box.bottom-u*0.15;
  // 一張一張貼上去，貼到畫面滿為止；放不下的就換小一點的形狀補空位
  let fails=0;
  for(const it of shuffle(items)){
    if(fails>8) break;
    wall.insertAdjacentHTML('beforeend', tileHTML(it));
    const t=wall.lastElementChild;
    if(t.getBoundingClientRect().bottom>limit){ t.remove(); fails++; } else fails=0;
  }
  GRID.cap = Math.max(wall.children.length, fails>8 ? wall.children.length : 99);
  GRID.swapT=setInterval(()=>{ if(!paused) swapOne(); }, CONFIG.swapSeconds*1000);
  if(CONFIG.featureSeconds) GRID.featT=setInterval(()=>{ if(!paused) feature(); }, CONFIG.featureSeconds*1000);
}
let lastSlot=-1;
function swapOne(){
  const tiles=[...document.querySelectorAll('.tile2')]; if(!tiles.length) return;
  let k; do{ k=Math.floor(Math.random()*tiles.length); }while(tiles.length>1 && k===lastSlot);
  lastSlot=k; swapSlot(tiles[k]);
}
function swapSlot(tile, forced){
  const it = forced || nextOfShape(tile.dataset.shape);
  if(!it){ if(!items.find(x=>x.id===tile.dataset.id)) tile.style.visibility='hidden'; return; }
  const im=new Image(); im.src=it.img;
  tile.querySelector('.pic')?.classList.add('out');
  setTimeout(()=>{ tile.dataset.id=it.id; tile.style.visibility=''; tile.innerHTML=tileInner(it); tile.querySelector('.pic').classList.add('in'); }, 350);
}
function placeNew(it){
  const same=[...document.querySelectorAll(`.tile2[data-shape="${shapeOf(it)}"]`)];
  if(same.length) swapSlot(same[Math.floor(Math.random()*same.length)], it);
  else { (GRID.queues[shapeOf(it)]||(GRID.queues[shapeOf(it)]=[])).unshift(it); }
}
function feature(it, ms=6500){
  if(!it){ const slots=[...document.querySelectorAll('.tile2')]; if(!slots.length) return; const s=slots[Math.floor(Math.random()*slots.length)]; it=items.find(x=>x.id===s.dataset.id); }
  if(!it) return;
  if(it.kind==='note'){
    $('#spotInner').innerHTML=`${noteHTML(it,true)}<div class="words"><span class="chip notechip">${ic('note')} 便利貼祝福</span><p class="by" style="margin-top:1vh">寫於「${esc(spotName(it.spot))}」</p></div>`;
    $('#spot').dataset.id=it.id; $('#spot').classList.add('show'); clearTimeout(feature.t); feature.t=setTimeout(()=>$('#spot').classList.remove('show'), ms); return;
  }
  const words = it.hand ? `<img class="hand" src="${it.hand}" alt="手寫留言">` : `<p class="msg ${it.kind==='scene'?'small':''}">「${esc(it.msg)}」</p>`;
  const scene=it.kind==='scene';
  const top = scene ? `<span class="chip work">${ic('camera')} 攝影作品・${esc(spotName(it.spot))}</span>${it.title?`<p class="ttl">《${esc(it.title)}》</p>`:''}` : `<span class="chip">${esc(spotAward(it.spot)||spotName(it.spot))}</span>${spotAward(it.spot)?`<p class="where">攝於${esc(spotName(it.spot))}</p>`:''}`;
  const body = it.hand ? words : (it.msg ? words : '');
  $('#spotInner').innerHTML=`<div class="big"><img id="bigImg" src="${it.img}" alt=""></div><div class="words">${top}${body}<p class="by">${scene?'攝影｜':''}<b>${esc(it.name)}</b>　第 ${esc(it.cls)} 屆</p></div>`;
  $('#spot').dataset.id=it.id; $('#spot').classList.add('show');
  if(it.full && it.full!==it.img){ const hi=new Image(); hi.onload=()=>{ const b=$('#bigImg'); if(b && b.getAttribute('src')===it.img) b.src=it.full; }; hi.src=it.full; }
  clearTimeout(feature.t); feature.t=setTimeout(()=>$('#spot').classList.remove('show'), ms);
}

/* ===================== 模式二：五個祕境（五欄同時捲動） ===================== */
let colRAF=null;
function renderCols(){
  cancelAnimationFrame(colRAF);
  const n=CONFIG.spots.length;
  $('#stage').innerHTML=`<div class="cols" style="--n:${n}">${CONFIG.spots.map(s=>{
    const list=items.filter(x=>x.spot===s.id), cards=list.map(cardHTML).join('');
    return `<section class="col">${s.award?`<p class="aw">${esc(s.award)}</p>`:''}<h2>${esc(s.name)}</h2><span class="n">${list.length} 張</span><div class="win"><div class="track">${cards}${list.length>6?cards:''}</div></div></section>`;
  }).join('')}</div>`;
  const tracks=[...document.querySelectorAll('.col .track')].map((t,i)=>({ t, y:0, v:0.016+(i%2)*0.005 }));
  let last=performance.now();
  const step=now=>{
    const dt=now-last; last=now;
    if(!paused) tracks.forEach(o=>{ const half=o.t.scrollHeight/2; if(o.t.children.length<12) return; o.y+=dt*o.v; if(o.y>half) o.y-=half; o.t.style.transform=`translateY(${-o.y}px)`; });
    colRAF=requestAnimationFrame(step);
  };
  colRAF=requestAnimationFrame(step);
}

function setMode(m){
  mode=m; document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode===m));
  $('#spot').classList.remove('show'); cancelAnimationFrame(colRAF); clearInterval(GRID.swapT); clearInterval(GRID.featT);
  if(m==='grid') renderGrid(); else renderCols();
}

/* ===================== 大結局：照片拼成愛心 → 數字 → 留言飄上來 → 謝幕 ===================== */
function heartSlots(count, W, H){
  // 在愛心形狀裡排格子：(x²+y²-1)³ - x²y³ ≤ 0
  const inside=(x,y)=>Math.pow(x*x+y*y-1,3)-x*x*y*y*y<=0;
  for(let size=Math.min(W,H)/4; size>6; size*=0.93){
    const cols=Math.floor(W*0.62/size), rows=Math.floor(H*0.86/size), pts=[];
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const x=((c+.5)/cols)*2.6-1.3, y=1.25-((r+.5)/rows)*2.6;
      if(inside(x,y)) pts.push({ x:W/2-cols*size/2+c*size, y:H*0.07+r*size });
    }
    if(pts.length>=count){ const ys=pts.map(p=>p.y), top=Math.min(...ys), bot=Math.max(...ys)+size, dy=(H-(bot-top))/2-top; pts.forEach(p=>p.y+=dy); return { pts, size }; }
  }
  return { pts:[], size:8 };
}
async function playFinale(){
  const items=all;
  if(inFinale || !items.length) return;
  inFinale=true; $('#spot').classList.remove('show'); sendState();
  const F=CONFIG.finale, fin=$('#finale'), W=innerWidth, H=innerHeight;
  const m=people(); const nPeople=m.size, nPhotos=items.length;
  fin.hidden=false; fin.innerHTML='';
  const kv=async ms=>{ const d=document.createElement('div'); d.className='kv'; fin.appendChild(d); await sleep(50); d.classList.add('show'); await sleep(ms); d.classList.remove('show'); await sleep(1400); d.remove(); };
  const say=async(html,ms)=>{ const d=document.createElement('div'); d.className='line'; d.innerHTML=html; fin.appendChild(d); await sleep(50); d.classList.add('show'); await sleep(ms); d.classList.remove('show'); await sleep(1300); d.remove(); };
  try{
    await kv(4200);
    if(!inFinale) return;
    await say(`${esc(F.opening)}<small>${esc(F.openingSub)}</small>`, 3200);
    if(!inFinale) return;
    // 照片飛進來拼成愛心
    const pool=shuffle(items); const want=Math.min(Math.max(pool.length,160),420);
    const { pts, size }=heartSlots(want, W, H);
    const use=pts.map((p,i)=>({ p, it:pool[i%pool.length] }));
    const tiles=use.map(({p,it},i)=>{
      const t=document.createElement('div'); t.className='tile'; t.style.width=t.style.height=(size-3)+'px';
      const a=Math.random()*Math.PI*2, r=Math.max(W,H);
      t.style.transform=`translate(${W/2+Math.cos(a)*r}px,${H/2+Math.sin(a)*r}px) rotate(${(Math.random()-.5)*90}deg)`;
      t.style.transitionDelay=(i/use.length*2.2).toFixed(2)+'s';
      t.innerHTML=`<img src="${it.tiny||it.img}" alt="" decoding="async">`; fin.appendChild(t); return { t, p };
    });
    await sleep(80);
    tiles.forEach(({t,p})=>{ t.style.transform=`translate(${p.x}px,${p.y}px) rotate(${(Math.random()-.5)*6}deg)`; });
    await sleep(5600);
    if(!inFinale) return;
    // 數字
    const st=document.createElement('div'); st.className='bigstats';
    st.innerHTML=`<div><b data-n="${nPeople}">0</b><span>位校友回家</span></div><div><b data-n="${nPhotos}">0</b><span>張照片</span></div><div><b data-n="${items.filter(x=>x.kind==='scene').length}">0</b><span>幅攝影作品</span></div><div><b data-n="${items.filter(x=>x.kind==='note').length}">0</b><span>張便利貼祝福</span></div><div><b data-n="${items.filter(x=>x.msg||x.hand).length}">0</b><span>句想說的話</span></div>`;
    fin.appendChild(st); await sleep(50); st.classList.add('show');
    const nums=[...st.querySelectorAll('b')], t0=performance.now();
    await new Promise(res=>{ const f=now=>{ const k=Math.min(1,(now-t0)/1800), e=1-Math.pow(1-k,3); nums.forEach(b=>b.textContent=Math.round(+b.dataset.n*e)); k<1?requestAnimationFrame(f):res(); }; requestAnimationFrame(f); });
    await sleep(3200);
    st.classList.remove('show'); tiles.forEach(({t})=>{ t.style.transitionDelay='0s'; t.style.opacity='.18'; });
    await sleep(900); st.remove();
    if(!inFinale) return;
    // 留言飄上來
    const msgs=shuffle(items.filter(x=>x.msg||x.hand)).slice(0,28), lanes=shuffle([0,1,2,3,4]);
    for(let i=0;i<msgs.length && inFinale;i++){
      const it=msgs[i], b=document.createElement('div'); b.className='bubble';
      b.style.left=(2+lanes[i%5]*19+Math.random()*2)+'vw'; b.style.maxWidth='18vw'; b.style.animationDuration='11s'; if(i%5===4) lanes.push(...shuffle(lanes.splice(0,5))); b.style.rotate=((Math.random()-.5)*6)+'deg';
      b.innerHTML=`${it.hand?`<img src="${it.hand}" alt="手寫留言">`:esc(it.msg)}<i>${esc(it.name)}・第 ${esc(it.cls)} 屆</i>`;
      fin.appendChild(b); setTimeout(()=>b.remove(), 14000);
      await sleep(1000);
    }
    await sleep(7000);
    if(!inFinale) return;
    tiles.forEach(({t})=>{ t.style.opacity='.08'; });
    // 片尾名單：依屆別列出每一位得獎的校友
    const byCls=new Map(); [...m.keys()].forEach(k=>{ const [c,n]=k.split('|'); (byCls.get(c)||byCls.set(c,[]).get(c)).push(n); });
    const groups=[...byCls.entries()].sort((a,b)=>(parseInt(a[0])||0)-(parseInt(b[0])||0));
    const cr=document.createElement('div'); cr.className='credits';
    cr.innerHTML=`<div class="roll"><h2>${esc(F.creditsTitle||'本屆得獎名單')}</h2><h3>頒發獎項</h3>${CONFIG.spots.map(s=>`<p class="awline">${esc(s.award||s.name)}</p>`).join('')}<div class="gap"></div><h3 style="margin-bottom:5vh">得獎校友</h3>${groups.map(([c,ns])=>`<section><h3>第 ${esc(c)} 屆</h3><p>${ns.map(esc).join('<span>　</span>')}</p></section>`).join('')}</div>`;
    fin.appendChild(cr);
    const roll=cr.firstElementChild, dist=roll.offsetHeight+H, dur=Math.min(60,Math.max(16, dist/90));
    roll.style.animation=`credits ${dur}s linear forwards`; roll.style.setProperty('--to',`-${roll.offsetHeight}px`);
    for(let w=0; w<dur*1000 && inFinale; w+=250) await sleep(250);
    cr.remove();
    if(!inFinale) return;
    await say(`${esc(F.closing)}<small>${esc(F.closingSub)}</small>`, 6000);
    if(!inFinale) return;
    await kv(8000);
  } finally {
    endFinale();
  }
}
function endFinale(){ if(!inFinale) return; inFinale=false; $('#finale').hidden=true; $('#finale').innerHTML=''; setMode(mode); sendState(); }

/* ===================== 控制 ===================== */
let ctlTimer=null;
function showCtl(){ if(DISPLAY) return; $('#ctl').classList.add('show'); clearTimeout(ctlTimer); ctlTimer=setTimeout(()=>$('#ctl').classList.remove('show'),3500); }
['mousemove','pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, showCtl));
function togglePause(v){ paused = typeof v==='boolean' ? v : !paused; $('#bPause').textContent=paused?'繼續':'暫停'; $('#bPause').setAttribute('aria-pressed',paused); sendState(); }
function openSheet(html){ $('#sheet').innerHTML=html; $('#modal').hidden=false; }
function closeSheet(){ $('#modal').hidden=true; }
function hidePicker(){
  const onWall=[...document.querySelectorAll('.tile2')].map(s=>items.find(x=>x.id===s.dataset.id)).filter(Boolean);
  const list=onWall.length ? onWall : items.slice(0,24);
  openSheet(`<h2>要隱藏哪一張？</h2><p style="color:var(--muted)">點照片後確認，就會從投影牆移除。</p>
    <div class="picker">${list.map(x=>`<button data-pick="${esc(x.id)}"><img src="${x.img}" alt="${esc(x.name)}"></button>`).join('')}</div>
    ${LIVE && !(FB && FB.auth.currentUser)?'<input type="password" id="pass" placeholder="後台密碼（管理員帳號的密碼）" autocomplete="off" style="margin-top:12px">':''}
    <div class="row"><button class="soft" data-k="cancel">取消</button></div>`);
}
async function hideOne(id){
  try{
    const { db, auth }=await fb();
    if(!auth.currentUser){
      const pass=$('#pass') && $('#pass').value; if(!pass){ $('#pass')?.focus(); return; }
      await auth.signInWithEmailAndPassword(CONFIG.adminEmail, pass);
    }
    await db.collection('entries').doc(id).update({ hidden:true });
    closeSheet(); removeItem(id); notice('已隱藏這張照片');
  }catch(e){ notice(/password|credential|user/.test(String(e.code)) ? '密碼不對，沒有隱藏' : '網路有問題或沒有權限，沒有隱藏'); }
}
document.addEventListener('click', e=>{
  if(DISPLAY) return;
  const pk=e.target.closest('[data-pick]'); if(pk){ hideOne(pk.dataset.pick); return; }
  const m=e.target.closest('[data-mode]'); if(m){ setMode(m.dataset.mode); return; }
  const b=e.target.closest('[data-k]'); if(!b) return;
  const k=b.dataset.k;
  if(k==='pause') togglePause();
  if(k==='feature') feature();
  if(k==='hide') hidePicker();
  if(k==='cancel') closeSheet();
  if(k==='finale') playFinale();
  if(k==='full'){ const d=document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : d.requestFullscreen?.())?.catch?.(()=>notice('這個視窗不能全螢幕，請按瀏覽器的全螢幕（F11）')); }
});
$('#finale').addEventListener('click', ()=>{ /* 大結局中點畫面不中斷，按 Esc 才停止 */ });
document.addEventListener('keydown', e=>{
  if(DISPLAY){ if(e.key==='f'||e.key==='F') document.documentElement.requestFullscreen?.().catch(()=>{}); return; }
  if(!$('#modal').hidden){ if(e.key==='Escape') closeSheet(); return; }
  if(e.key==='Escape' && inFinale){ endFinale(); return; }
  if(e.key===' '){ e.preventDefault(); togglePause(); }
  if(e.key==='f'||e.key==='F') document.documentElement.requestFullscreen?.().catch(()=>{});
  if(e.key==='1') setMode('grid'); if(e.key==='2') setMode('cols');
  if(e.key==='z'||e.key==='Z') feature();
  if(e.key==='e'||e.key==='E') playFinale();
});
let rt=null; addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(!inFinale) setMode(mode); }, 400); });


/* ===================== 遙控：接收控制台的指令 =====================
   同一台電腦：BroadcastChannel（不用網路、最快）
   其他裝置（例如用手機當遙控器）：Firestore 的 control/wall 文件 */
const BC = 'BroadcastChannel' in window ? new BroadcastChannel('kghs-wall') : null;
const SEEN=new Set(), BOOT=Date.now();
function sendState(){ if(!BC) return; try{ BC.postMessage({ type:'state', display:DISPLAY, mode, paused, inFinale, standby, filter:{...WF}, shown:items.length, total:all.length, featured:$('#spot').classList.contains('show')?$('#spot').dataset.id:null, t:Date.now() }); }catch(_){} }
function setStandby(v){ standby=!!v; $('#standby').hidden=!standby; sendState(); }
function runCmd(m){
  if(!m || m.type!=='cmd' || !m.id || SEEN.has(m.id)) return; SEEN.add(m.id);
  const c=m.cmd;
  if(c==='ping') return sendState();
  if(c==='mode'){ if(inFinale) endFinale(); setMode(m.v==='cols'?'cols':'grid'); }
  if(c==='pause') togglePause(!!m.v);
  if(c==='standby') setStandby(m.v);
  if(c==='feature'){ const it=all.find(x=>x.id===m.v); if(it && !inFinale){ setStandby(false); feature(it, (m.sec||12)*1000); } }
  if(c==='featureRandom' && !inFinale) feature();
  if(c==='unfeature'){ clearTimeout(feature.t); $('#spot').classList.remove('show'); }
  if(c==='finale'){ setStandby(false); playFinale(); }
  if(c==='stopFinale') endFinale();
  if(c==='filter'){ WF.spot=m.spot||'all'; WF.kind=m.kind||'all'; refilter(); if(!inFinale) setMode(mode); }
  if(c==='hide') removeItem(m.v);
  if(c==='notice' && m.v) notice(String(m.v).slice(0,60));
  if(c==='reload') location.reload();
  sendState();
}
if(BC) BC.onmessage=e=>runCmd(e.data);
async function listenRemote(){
  if(!LIVE) return; const { db }=await fb();
  db.collection('control').doc('wall').onSnapshot(d=>{ const m=d.data(); if(m && m.t>BOOT-5000) runCmd(m); }, ()=>{});
}
setInterval(sendState, 4000);
if(DISPLAY){
  document.body.classList.add('display');
  $('#fsHint').hidden=false;
  const hideHint=()=>{ $('#fsHint').hidden=!!document.fullscreenElement; };
  document.addEventListener('fullscreenchange', hideHint);
  document.addEventListener('dblclick', ()=>{ (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.())?.catch?.(()=>{}); });
  setTimeout(()=>{ if(!document.fullscreenElement) $('#fsHint').classList.add('dim'); }, 8000);
}

/* ===================== 啟動 ===================== */
(async function init(){
  tick(); setInterval(tick, 20000);
  if(LIVE){ $('#stage').innerHTML='<p class="empty">讀取照片中…</p>'; try{ await subscribe(); }catch(e){ notice('讀不到資料，請確認網路'); } listenRemote().catch(()=>{}); }
  else $('#stage').innerHTML='<p class="empty">還沒設定 Firebase：請在 wall.html 的 CONFIG.firebase 貼上設定</p>';
})();
</script>
