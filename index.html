<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雄女祕境集章</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Huninn&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF1F4; --card:#FFFFFF; --ink:#2F2838; --muted:#6B6176; --line:#EBDCE5;
  --pink:#F2668C; --pink-d:#D14B72; --pink-l:#FF8FAB; --lilac:#C9B6FF;
  --t-pink:#FFE3EB; --t-lilac:#EEE8FF; --t-butter:#FFF6D4; --t-mint:#E3F7EE; --t-sky:#E6F1FF;
  --round:"Huninn","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --cute:"Gaegu","Huninn","PingFang TC",sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#221C29; --card:#2E2638; --ink:#F6EEF6; --muted:#BDB1C6; --line:#43384E;
    --pink:#FF7EA0; --pink-d:#D9587C;
    --t-pink:#3F2A37; --t-lilac:#342C4A; --t-butter:#3D3628; --t-mint:#253A33; --t-sky:#263347;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#221C29; --card:#2E2638; --ink:#F6EEF6; --muted:#BDB1C6; --line:#43384E;
  --pink:#FF7EA0; --pink-d:#D9587C;
  --t-pink:#3F2A37; --t-lilac:#342C4A; --t-butter:#3D3628; --t-mint:#253A33; --t-sky:#263347;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--round);font-size:18px;line-height:1.7;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:66px 16px 56px}
.sound{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:15;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.95rem;cursor:pointer;box-shadow:0 3px 8px rgba(60,40,70,.12)}
.view[hidden],[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:400}
img{max-width:100%}
.tiny{font-size:.88rem;color:var(--muted);margin-top:8px}
.center{text-align:center}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{appearance:none;border:0;border-radius:18px;padding:14px 20px;min-height:58px;font:inherit;font-size:1.1rem;background:var(--pink);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 0 var(--pink-d);text-align:center;line-height:1.35}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pink-d)}
.btn.soft{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);border:2px solid var(--line)}
.btn.small{padding:8px 16px;min-height:46px;font-size:1rem;border-radius:14px}
.btn.wide{width:100%}
.btn.white{background:#fff;color:#B33A62;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.btn.dim{opacity:.45}
.stack{display:grid;gap:12px;margin-top:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair.wide2{grid-template-columns:1fr 2fr}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,label.btn:focus-within{outline:3px solid var(--lilac);outline-offset:2px}

.inapp{background:#FFF6D4;color:#5A4500;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:.98rem}

/* 開局 */
.cover{min-height:calc(100vh - 80px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.cover .hello{font-family:var(--cute);font-size:1.7rem;color:var(--pink);line-height:1}
.cover h1{font-size:2.8rem;line-height:1.15}
.cover .lede{color:var(--muted);line-height:1.85}
.joincard{background:var(--card);border-radius:24px;padding:18px;border:2px solid var(--line)}
.field{display:block;margin-top:14px}
.field:first-child{margin-top:0}
.field span{display:block;color:var(--ink);margin-bottom:6px}
input[type=text],input[type=number],textarea{width:100%;border:2px solid var(--line);border-radius:16px;padding:14px 16px;font:inherit;font-size:1.1rem;background:var(--bg);color:var(--ink)}
.consent{display:flex;gap:12px;align-items:flex-start;margin:16px 0;font-size:1rem;color:var(--muted);cursor:pointer}
.consent input{width:28px;height:28px;margin-top:2px;accent-color:var(--pink);flex:none}

/* 主頁 */
.pass{background:var(--t-pink);border-radius:24px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}
.pass .who{font-size:1.7rem;line-height:1.25}
.pass .meta{color:var(--muted)}
.count{grid-row:1/3;grid-column:2;text-align:right;font-family:var(--cute);font-weight:700;font-size:2.8rem;line-height:1;color:var(--pink)}
.count span{font-size:1.3rem;color:var(--muted)}
.stamps{display:flex;justify-content:space-between;gap:6px;margin:20px 4px 4px}
.slot{width:60px;height:60px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;font-size:1.5rem;color:var(--muted);user-select:none}
.slot.on{border:4px solid #fff;background:var(--pink-l);color:#fff;box-shadow:0 4px 10px rgba(242,102,140,.35);transform:rotate(-8deg)}
.slot.on:nth-child(2){background:#B9A4FF;transform:rotate(6deg)}
.slot.on:nth-child(3){background:#FFC233;transform:rotate(-4deg)}
.slot.on:nth-child(4){background:#5FCB9A;transform:rotate(9deg)}
.slot.on:nth-child(5){background:#74B3FF;transform:rotate(-10deg)}
.slot.thump{animation:pop .6s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{0%{transform:scale(2.1) rotate(-30deg);opacity:0}55%{opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.slot.thump{animation:none}}
.howto{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 18px;margin-top:18px}
.howto h2{font-size:1.25rem;margin-bottom:6px}
.howto ol{margin:0;padding-left:1.4em}
.howto li{margin:4px 0}
.unlock{margin-top:18px;background:var(--pink);color:#fff;border-radius:24px;padding:18px 18px 20px}
.unlock h2{font-size:1.5rem}
.unlock p{margin:4px 0 14px}
.spots{display:grid;gap:14px;margin-top:18px}
.spot{border-radius:22px;padding:16px 16px 18px}
.spot:nth-child(5n+1){background:var(--t-pink)}
.spot:nth-child(5n+2){background:var(--t-lilac)}
.spot:nth-child(5n+3){background:var(--t-butter)}
.spot:nth-child(5n+4){background:var(--t-mint)}
.spot:nth-child(5n+5){background:var(--t-sky)}
.spot .head{display:flex;align-items:center;gap:10px}
.spot .mark{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.15rem;flex:none}
.spot h3{font-size:1.3rem}
.spot h3.unknown{color:var(--muted);letter-spacing:.2em}
.riddle{line-height:1.9;margin:10px 0}
.hint{margin-bottom:10px}
.hint summary{cursor:pointer;color:var(--pink);display:inline-block;padding:4px 0}
.hint p{margin-top:4px;color:var(--muted)}
.status{color:var(--muted);margin-bottom:12px;font-size:1rem}
.status.ok{color:var(--pink)}
.done{display:flex;gap:12px;align-items:flex-start}
.done img{width:88px;height:116px;object-fit:cover;border-radius:12px;border:3px solid #fff;flex:none}
.said{margin-bottom:8px;line-height:1.6}
.devtools{margin-top:28px;border:2px dashed var(--line);border-radius:18px;padding:10px 14px;font-size:.9rem}
.devtools summary{cursor:pointer;color:var(--muted)}
.devtools p{margin-top:10px}
.devtools code{font-size:.78rem;word-break:break-all}

/* 編輯器 */
.bar{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.bar h2{font-size:1.3rem;flex:1}
.steps{display:flex;gap:6px;margin:6px 0 14px}
.steps span{flex:1;text-align:center;padding:6px 0;border-radius:12px;background:var(--card);color:var(--muted);font-size:.98rem;border:2px solid var(--line)}
.steps span.on{background:var(--pink);border-color:var(--pink);color:#fff}
.steps span.past{color:var(--pink);border-color:var(--pink-l)}
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pick{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:14px 8px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px}
.pick[aria-pressed="true"]{border-color:var(--pink);background:var(--t-pink)}
.pick .ico{display:flex;flex-direction:column;gap:3px}
.pick .ico i{display:block;width:40px;height:26px;border-radius:5px;background:var(--pink-l)}
.pick .ico.one i{width:44px;height:56px}
.pick .ico i{width:34px;height:20px}
.pick .ico.grid{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.pick .ico.grid i{width:22px;height:28px}
.pick b{font-weight:400;font-size:1.1rem}
.pick small{color:var(--muted);font-size:.88rem;margin-top:-6px}
.stage{background:var(--card);border-radius:22px;padding:12px;border:2px solid var(--line);display:flex;justify-content:center}
#cv{display:block;width:auto;height:auto;max-width:100%;max-height:48vh;touch-action:pan-y;border-radius:6px;box-shadow:0 6px 18px rgba(60,40,70,.14)}
.selbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.zoomrow{display:flex;align-items:center;gap:12px;margin-top:14px}
.zoomrow input{flex:1;accent-color:var(--pink);height:32px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.tabs button{border:2px solid var(--line);background:var(--card);font:inherit;font-size:.98rem;color:var(--ink);padding:10px 0;border-radius:14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.panel{padding-top:14px}
.row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch}
.row.wrapr{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;font:inherit;font-size:1rem;cursor:pointer;min-height:46px}
.chip[aria-pressed="true"]{border-color:var(--pink);background:var(--pink);color:#fff}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sw{border:0;background:transparent;font:inherit;font-size:.95rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:0}
.sw i{width:56px;height:56px;border-radius:50%;border:4px solid var(--card);box-shadow:0 0 0 2px var(--line)}
.sw[aria-pressed="true"] i{box-shadow:0 0 0 4px var(--pink)}
.sw[aria-pressed="true"]{color:var(--ink)}
.stkgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stk{aspect-ratio:1;border:2px solid var(--line);border-radius:18px;background:var(--card);cursor:pointer;padding:8px;display:grid;place-items:center}
.stk img{width:100%;height:100%;object-fit:contain}
.words{display:flex;flex-wrap:wrap;gap:12px}
.word{border:3px solid #fff;border-radius:999px;padding:6px 16px;font-family:var(--cute);font-weight:700;font-size:1.25rem;cursor:pointer;box-shadow:0 3px 6px rgba(60,40,70,.15)}
.label{display:block;margin:4px 0 8px}
textarea{min-height:110px;resize:vertical}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#preview{display:block;max-height:42vh;width:auto;max-width:100%;margin:0 auto 16px;border-radius:8px;box-shadow:0 6px 18px rgba(60,40,70,.14)}
#inviteImg{display:block;width:100%;border-radius:20px;min-height:200px;background:var(--card)}

.mine{display:flex;gap:8px;margin-top:16px}
.mine input{flex:1;min-width:0}
.dots{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.dot{width:40px;height:40px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0}
.dot[aria-pressed="true"]{box-shadow:0 0 0 4px var(--pink)}
.sub{font-size:.95rem;color:var(--muted);margin:14px 0 4px}
.sw i.lace{background:radial-gradient(circle,#fff 0 35%,transparent 36%) 0 0/14px 14px,#F8C9D6}
.sw i.night{background:radial-gradient(circle,#fff 0 12%,transparent 14%) 0 0/12px 12px,#2B2D5B}
.who-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.tabs4{grid-template-columns:repeat(4,1fr);margin-top:14px}
.tabs4 button{font-size:1.02rem;padding:12px 0}
.donebar{position:sticky;bottom:0;margin:22px -16px -56px;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 24%);z-index:3}
#pad{display:block;width:100%;height:auto;aspect-ratio:900/420;background:#fff;border-radius:18px;border:2px solid var(--line);touch-action:none;margin-top:12px}
.said-hand{display:block;max-height:64px;max-width:100%;margin-bottom:8px}
.wall-hand{display:block;max-width:100%;max-height:34vh}
#cv{max-height:46vh}
/* 劇情 */
.story{min-height:calc(100vh - 128px);display:flex;flex-direction:column;gap:18px;padding-top:8px}
.story .top{display:flex;justify-content:flex-start}
.scene{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:22px;padding:10px 6px;animation:sceneIn .7s ease}
.scene img{width:120px;height:120px;filter:drop-shadow(0 6px 10px rgba(60,40,70,.15))}
.scene p{font-size:1.45rem;line-height:1.9}
.scene .who{color:var(--pink)}
@keyframes sceneIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scene{animation:none}}
.sdots{display:flex;justify-content:center;gap:8px}
.sdots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.sdots i.on{background:var(--pink);width:26px;border-radius:6px}
.linkbtn{background:none;border:0;color:var(--pink);font:inherit;font-size:1rem;text-decoration:underline;cursor:pointer;padding:8px 0}
.syncbar{background:var(--t-butter);border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;margin-top:12px;font-size:.95rem}
.syncbar span{flex:1}
.syncst{font-size:.85rem;color:var(--muted)}
.syncst.sent{color:#3E9A6E}
.syncst.failed{color:#C0392B}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:14px 8px;font:inherit;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.kind[aria-pressed="true"]{border-color:var(--pink);background:var(--t-pink)}
.kind .ki{font-size:2rem;line-height:1.2}
.kind b{font-weight:400;font-size:1.05rem}
.kind small{color:var(--muted);font-size:.85rem}
.work{font-size:.95rem;color:var(--pink);margin-bottom:2px}
.seg{display:flex;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px;gap:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:1rem;padding:9px 4px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pink);color:#fff}
.tpls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tpl{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:6px 6px 8px;font:inherit;font-size:.92rem;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.tpl[aria-pressed="true"]{border-color:var(--pink)}
.tpl .pv{position:relative;width:100%;aspect-ratio:4/5;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.tpl .pv .hole{position:absolute;left:10%;top:8%;width:80%;height:66%;border-radius:6px;background:rgba(255,255,255,.7)}
.tpl .pv img{position:absolute;width:30%;transform:translate(-50%,-50%)}
.tpl .pv span{position:absolute;transform:translate(-50%,-50%);font-family:var(--cute);font-weight:700;font-size:.7rem;white-space:nowrap;padding:1px 6px;border-radius:999px;border:2px solid #fff}
.ideas{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.idea{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 8px;font:inherit;font-size:.98rem;color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;line-height:1.35}
.idea i{font-style:normal;font-size:1.5rem}
.idea[aria-pressed="true"]{border-color:var(--pink);background:var(--t-pink)}
.idea-card{margin-top:10px;background:var(--t-lilac);border-radius:16px;padding:12px 14px;font-size:1rem;line-height:1.7}
.idea-card b{font-weight:400;color:var(--pink)}
/* ===== 相機與編輯（美圖秀秀式） ===== */
body.fullmode .sound{display:none}
body.fullmode .toast{bottom:auto;top:calc(72px + env(safe-area-inset-top,0px))}
.full{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column}
#cam{background:#000;color:#fff}
.cam-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
.ico-btn{width:46px;height:46px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:1.3rem;cursor:pointer}
.lay-seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lay-seg button{border:0;background:transparent;color:#ddd;font:inherit;font-size:.92rem;padding:7px 12px;border-radius:999px;cursor:pointer}
.lay-seg button[aria-pressed="true"]{background:#fff;color:#2F2838}
.cam-view{position:relative;flex:1;min-height:0;overflow:hidden;background:#15111A}
#vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#vid.mirror{transform:scaleX(-1)}
#fakeCam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam-grid{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(90deg,transparent 33.2%,rgba(255,255,255,.35) 33.2% 33.5%,transparent 33.5% 66.5%,rgba(255,255,255,.35) 66.5% 66.8%,transparent 66.8%),
  linear-gradient(180deg,transparent 33.2%,rgba(255,255,255,.35) 33.2% 33.5%,transparent 33.5% 66.5%,rgba(255,255,255,.35) 66.5% 66.8%,transparent 66.8%)}
.cam-prog{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.cam-prog i{width:34px;height:42px;border-radius:6px;border:2px solid rgba(255,255,255,.8);background:rgba(255,255,255,.18) center/cover no-repeat}
.cam-prog i.next{border-color:var(--pink);box-shadow:0 0 0 2px var(--pink)}
.cam-info{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:6px 16px;font-size:1rem;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.cam-info:empty{display:none}
.cam-tip{position:absolute;left:12px;right:12px;bottom:56px;background:rgba(255,255,255,.95);color:#2F2838;border-radius:16px;padding:10px 14px;font-size:1rem;line-height:1.6}
.cam-tip b{font-weight:400;color:var(--pink-d)}
.cam-fail{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:#1E1826}
.cam-fail .cf-t{font-size:1.4rem}
.cam-fail .cf-s{color:#C9BCD2;margin-bottom:6px}
.cam-fail .btn{min-width:220px}
.cam-bottom{padding:8px 0 calc(14px + env(safe-area-inset-bottom,0px));background:#000}
.cam-ideas{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none}
.cam-ideas::-webkit-scrollbar{display:none}
.cam-ideas button{flex:none;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-size:.92rem;cursor:pointer}
.cam-ideas button[aria-pressed="true"]{background:#fff;color:#2F2838}
.cam-modes{display:flex;justify-content:center;gap:24px;padding:2px 0 12px}
.cam-modes button{border:0;background:none;color:#9C93A6;font:inherit;font-size:1.08rem;padding:4px 2px;cursor:pointer;border-bottom:3px solid transparent}
.cam-modes button[aria-pressed="true"]{color:#fff;border-color:var(--pink)}
.cam-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 20px}
.side-btn{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;background:none;border:0;font:inherit;font-size:.88rem;cursor:pointer}
.side-btn .thumb{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.16) center/cover no-repeat;display:grid;place-items:center;font-size:1.45rem}
.side-btn b{font-weight:400}
.shutter{width:84px;height:84px;border-radius:50%;border:5px solid #fff;background:transparent;padding:5px;cursor:pointer}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:var(--pink);transition:transform .1s}
.shutter:active span{transform:scale(.88)}
.shutter:disabled{opacity:.45}

#edit{background:var(--bg);color:var(--ink)}
.ed-top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 8px}
.ed-back{border:0;background:none;font:inherit;font-size:1.08rem;color:var(--ink);padding:8px 4px;cursor:pointer}
.ed-title{flex:1;text-align:center;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ed-done{border:0;background:var(--pink);color:#fff;font:inherit;font-size:1.08rem;border-radius:999px;padding:9px 22px;box-shadow:0 3px 0 var(--pink-d);cursor:pointer}
.ed-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px}
#edit #cv{display:block;width:auto;height:auto;max-width:100%;max-height:100%;touch-action:none;border-radius:6px;box-shadow:0 6px 18px rgba(60,40,70,.16)}
.ed-hint{text-align:center;font-size:.88rem;color:var(--muted);min-height:1.6em;padding:4px 12px 6px}
.panel-sheet{background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(60,40,70,.12);max-height:44vh;display:flex;flex-direction:column}
#edit.msgopen .panel-sheet{max-height:62vh}
.ps-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px}
.ps-head b{font-weight:400;font-size:1.05rem}
.ps-ok{border:0;background:var(--t-pink);color:var(--pink-d);font:inherit;border-radius:999px;padding:6px 14px;cursor:pointer}
.ps-body{overflow:auto;padding:6px 16px 12px;-webkit-overflow-scrolling:touch}
.hrow{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}
.hrow>*{flex:none}
.hrow .tpl{width:96px}
.hrow .sw{width:62px}
.stks .stk{width:66px;height:66px}
.hrow .word{white-space:nowrap}
.fl{width:74px;border:0;background:none;font:inherit;font-size:.88rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:0}
.fl img,.fl .ph{width:66px;height:82px;object-fit:cover;border-radius:12px;border:3px solid transparent;background:var(--t-pink)}
.fl[aria-pressed="true"]{color:var(--ink)}
.fl[aria-pressed="true"] img,.fl[aria-pressed="true"] .ph{border-color:var(--pink)}
.toolbar{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))}
.toolbar button{border:0;background:none;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.8rem;padding:6px 0;cursor:pointer;border-radius:12px}
.toolbar button i{font-style:normal;font-size:1.45rem;line-height:1.25}
.toolbar button[aria-pressed="true"]{background:var(--t-pink);color:var(--pink-d)}
#pad{display:block;width:100%;height:auto;aspect-ratio:900/420;background:#fff;border-radius:18px;border:2px solid var(--line);touch-action:none}
body:not(.test) .testonly{display:none!important}
/* 對話框 */
.modal{position:fixed;inset:0;z-index:40;background:rgba(30,20,35,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--card);border-radius:26px;padding:22px 20px 20px;max-width:460px;width:100%;max-height:86vh;overflow:auto}
.sheet h2{font-size:1.45rem;margin-bottom:8px}
.sheet p{margin-bottom:10px}
.sheet ol{margin:0 0 12px;padding-left:1.4em}
.sheet li{margin:4px 0}
.sheet .os{font-weight:400;color:var(--pink);margin-top:10px}

/* 倒數自拍 */
#booth{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
#vid{flex:1;width:100%;min-height:0;object-fit:cover;background:#000}
#vid.mirror{transform:scaleX(-1)}
#count{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--cute);font-weight:700;font-size:11rem;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.5);pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.booth-top{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:12px;right:12px;text-align:center;color:#fff;font-size:1.25rem;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.booth-bar{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));background:#000}
.booth-bar .btn.soft{background:#2A2A2A;color:#fff;border-color:#3A3A3A;box-shadow:none;font-size:1rem;padding:8px}

/* 投影牆 */
#wall{position:fixed;inset:0;z-index:5;background:#1F1A26;color:#F6EEF6;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.wall-exit{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;background:transparent;color:#B1A5BB;border:1px solid #3E3449;border-radius:999px;padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.wall-card{display:grid;gap:26px;align-items:center;max-width:1200px;margin:0;animation:fade .8s ease}
.wall-card img{max-height:60vh;width:auto;max-width:100%;border-radius:8px;justify-self:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.wall-msg{font-size:clamp(1.5rem,3.4vw,3rem);line-height:1.5}
.wall-by{margin-top:14px;color:#FF9DB6;font-size:clamp(.95rem,1.6vw,1.3rem)}
.wall-empty{font-size:1.3rem;color:#B1A5BB;text-align:center;line-height:1.8}
@media (min-aspect-ratio:1/1){.wall-card{grid-template-columns:auto minmax(0,1fr)}.wall-card img{max-height:84vh}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.wall-card,#flash.go{animation:none}}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:18px;font-size:1.02rem;max-width:calc(100% - 32px);text-align:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<button class="sound" id="soundBtn" aria-pressed="true">🔊 聲音開</button>
<main class="wrap">
  <div class="inapp" id="inapp" hidden>目前是在 App 裡開啟網頁，相機可能無法使用。請點右上角「⋯」，選「用瀏覽器開啟」。</div>

  <section id="join" class="view" hidden>
    <div class="cover">
      <p class="hello">welcome home ♡</p>
      <h1>雄女<br>祕境集章</h1>
      <p class="lede">校園裡藏著五個祕境。猜出地點、到現場拍照、留一句話，集滿五章就能拿到今晚聚餐的邀請函。</p>
      <div class="joincard">
        <label class="field"><span>怎麼稱呼妳？</span><input type="text" id="jName" maxlength="12" autocomplete="nickname" placeholder="例如：小美"></label>
        <label class="field"><span>妳是第幾屆畢業？</span><input type="number" id="jCls" inputmode="numeric" min="1" max="200" placeholder="例如：45"></label>
        <label class="field"><span>手機號碼末三碼</span><input type="text" id="jL3" inputmode="numeric" maxlength="3" pattern="[0-9]*" autocomplete="off" placeholder="例如：168"></label>
        <p class="tiny">換手機或不小心關掉網頁時，輸入同樣的稱呼、屆別和末三碼，就能接著上次的進度玩。</p>
        <label class="consent"><input type="checkbox" id="jOk"><span>我同意照片和留言在聚餐現場投影播放。</span></label>
        <button class="btn wide" id="joinBtn">開始</button>
        <p class="center"><button class="linkbtn" data-act="intro">再看一次開場故事</button></p>
      </div>
      <details class="devtools testonly">
        <summary>原型測試工具（正式版會移除）</summary>
        <div class="row wrapr" style="margin-top:10px"><button class="chip" data-act="intro">預覽開場劇情</button><button class="chip" data-act="previewEnd">預覽結尾</button><button class="chip" data-act="previewInvite">只看邀請函</button></div>
      </details>
    </div>
  </section>

  <section id="story" class="view" hidden>
    <div class="story">
      <div class="top"><button class="btn soft small" data-act="storyskip">跳過</button></div>
      <div class="scene" id="scene"></div>
      <div class="sdots" id="sdots"></div>
      <button class="btn wide" data-act="storynext" id="storyNext">下一頁</button>
    </div>
  </section>

  <section id="home" class="view" hidden></section>



  <section id="invite" class="view" hidden>
    <div class="bar"><button class="btn soft small" data-act="home">返回</button><h2>邀請函</h2></div>
    <img id="inviteImg" alt="聚餐邀請函">
    <p class="tiny center">用手指長按圖片，就可以存到手機相簿。</p>
  </section>
</main>

<section id="cam" class="view full" hidden>
  <div class="cam-top">
    <button class="ico-btn" data-ed="close" aria-label="離開">✕</button>
    <div class="lay-seg" id="camLayouts">
      <button data-layout="single">單張</button><button data-layout="strip">四格條</button><button data-layout="grid">四格方</button>
    </div>
    <button class="ico-btn" data-ed="flip" aria-label="切換前後鏡頭">⟲</button>
  </div>
  <div class="cam-view" id="camView">
    <video id="vid" playsinline muted autoplay></video>
    <canvas id="fakeCam" hidden></canvas>
    <div class="cam-grid" id="camGrid" hidden></div>
    <div class="cam-prog" id="camProg"></div>
    <div class="cam-tip" id="camTip" hidden></div>
    <p class="cam-info" id="shotInfo"></p>
    <div id="count"></div>
    <div id="flash"></div>
    <div class="cam-fail" id="camFail" hidden>
      <p class="cf-t">相機還沒打開</p>
      <p class="cf-s">按下面的按鈕，手機問妳時請選「允許」</p>
      <button class="btn" data-ed="retrycam">開啟相機</button>
      <label class="btn soft">改用手機相機拍<input class="vh" type="file" accept="image/*" capture="user" id="fCam"></label>
      <button class="linkbtn" style="color:#FFB3C7" data-ed="camhelp">打不開怎麼辦？</button>
      <button class="btn soft small testonly" style="margin-top:8px;background:#2E2638;color:#FFE08A;border-color:#4A3F55" data-ed="fakecam">🧪 用測試假相機（測試版）</button>
    </div>
  </div>
  <div class="cam-bottom">
    <div class="cam-ideas" id="camIdeas"></div>
    <div class="cam-modes" id="camModes">
      <button data-mode="selfie">自拍</button><button data-mode="group">請人幫拍</button><button data-mode="scene">拍風景</button>
    </div>
    <div class="cam-row">
      <label class="side-btn"><span class="thumb" id="galThumb">🖼️</span>相簿<input class="vh" type="file" accept="image/*" id="fLib"></label>
      <button class="shutter" id="shutter" aria-label="拍照"><span></span></button>
      <button class="side-btn" data-ed="timer"><span class="thumb">⏱</span><b id="timerLbl">3 秒</b></button>
    </div>
  </div>
</section>

<section id="edit" class="view full" hidden>
  <div class="ed-top">
    <button class="ed-back" data-ed="retake">‹ 重拍</button>
    <p class="ed-title" id="edTitle"></p>
    <button class="ed-done" data-ed="finish">完成</button>
  </div>
  <div class="ed-stage" id="edStage"><canvas id="cv" aria-label="照片編輯區"></canvas></div>
  <p class="ed-hint" id="edHint"></p>
  <div class="panel-sheet" id="panel" hidden>
    <div class="ps-head"><b id="psTitle"></b><button class="ps-ok" data-ed="closetool">✓ 好了</button></div>
    <div class="ps-body">
      <div class="tp" id="t-tpl"><div class="hrow" id="tpls"></div></div>
      <div class="tp" id="t-frame">
        <div class="hrow" id="frames"></div>
        <div class="row wrapr" style="margin-top:8px"><button class="chip" data-ed="cap" id="capBtn">底部文字：顯示</button></div>
        <div class="zoomrow" id="zoomrow"><span id="zoomLabel">放大照片</span><input type="range" id="zoom" min="1" max="4" step="0.01" value="1" aria-label="放大照片"></div>
      </div>
      <div class="tp" id="t-filter"><div class="hrow" id="filters"></div></div>
      <div class="tp" id="t-sticker"><div class="row" id="stkcats"></div><div class="hrow stks" id="stkbox"></div></div>
      <div class="tp" id="t-word">
        <div class="hrow" id="words"></div>
        <div class="mine"><input type="text" id="myText" maxlength="12" placeholder="自己打字…"><button class="btn small" data-ed="addtext">貼上</button></div>
        <div class="dots" id="textColors"></div>
      </div>
      <div class="tp" id="t-pen">
        <div class="dots" id="penColors" style="margin-top:0"></div>
        <div class="row wrapr" style="margin-top:10px" id="penSizes"></div>
        <div class="pair" style="margin-top:8px"><button class="btn soft small" data-ed="undo">復原一筆</button><button class="btn soft small" data-ed="clearpen">全部擦掉</button></div>
      </div>
      <div class="tp" id="t-msg">
        <div class="seg" id="msgMode"><button data-mode2="type">打字留言</button><button data-mode2="hand">手寫留言</button></div>
        <div id="m-title" hidden>
          <label class="sub" for="title" style="display:block;margin-top:0">作品名稱</label>
          <input type="text" id="title" maxlength="14" placeholder="幫這張作品取個名字">
          <div class="quick" id="titleQuick"></div>
        </div>
        <div id="m-type">
          <label class="sub" for="msg" id="msgLabel" style="display:block">留一句話給大家</label>
          <textarea id="msg" maxlength="50" placeholder="寫一句話給大家（50 字內）"></textarea>
          <div class="row" id="quickCats"></div>
          <div class="quick" id="quick"></div>
          <p class="sub">要放在照片上嗎？</p>
          <div class="row wrapr" id="msgPlace">
            <button class="chip" data-place="caption">寫在相框底部</button>
            <button class="chip" data-place="note">做成便利貼</button>
            <button class="chip" data-place="none">不放，只投影</button>
          </div>
        </div>
        <div id="m-hand" hidden>
          <canvas id="pad" aria-label="手寫板，用手指寫字"></canvas>
          <div class="dots" id="padColors"></div>
          <div class="pair" style="margin-top:10px"><button class="btn soft small" data-ed="padundo">復原一筆</button><button class="btn soft small" data-ed="padclear">全部擦掉</button></div>
          <button class="btn wide" style="margin-top:10px" data-ed="padput" id="padPut">貼到照片上</button>
        </div>
      </div>
    </div>
  </div>
  <nav class="toolbar" id="toolbar">
    <button data-tool="tpl"><i>✨</i>範例</button>
    <button data-tool="frame"><i>🖼️</i>相框</button>
    <button data-tool="filter"><i>🌸</i>美顏</button>
    <button data-tool="sticker"><i>🎀</i>貼紙</button>
    <button data-tool="word"><i>🔤</i>文字</button>
    <button data-tool="pen"><i>✏️</i>塗鴉</button>
    <button data-tool="msg"><i>💬</i><span id="msgTabLbl">留言</span></button>
  </nav>
</section>

<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<section id="wall" class="view" hidden>
  <button class="wall-exit" data-act="exitwall">離開投影</button>
  <div id="wallStage"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* LINE 內建瀏覽器常常無法開相機：自動改用手機預設瀏覽器開啟 */
(function(){
  const ua=navigator.userAgent||'';
  try{
    const u=new URL(location.href);
    if(/\bLine\//i.test(ua) && !u.searchParams.has('openExternalBrowser')){ u.searchParams.set('openExternalBrowser','1'); location.replace(u.toString()); }
  }catch(e){}
})();

/* ===================== 活動設定（之後改這裡就好） ===================== */
const CONFIG = {
  // 測試模式：true 會顯示「原型測試工具」與測試假相機；正式上線請改成 false（網址加 ?test=1 仍可臨時打開）
  testMode: true,
  eventName: '雄女校友回娘家',
  // 點位名稱、謎題、提示為範例，請換成實際的雄女祕境；id 與 key 會寫進現場 QR Code 網址
  spots: [
    { id:'s1', key:'q7k2', stamp:'鐘', name:'鐘聲之處', riddle:'三年裡妳聽我說了上千次「下課」，卻很少有人抬頭找過我在哪裡。', hint:'找找看上下課的鐘聲從哪裡傳出來。' },
    { id:'s2', key:'m3x9', stamp:'樹', name:'老樹底下', riddle:'每一屆的畢業照背後都有我。我比妳們每一屆都還要老。', hint:'校園裡最老的那棵樹。' },
    { id:'s3', key:'t8p4', stamp:'階', name:'遲到的階梯', riddle:'早自習鐘響的那一刻，妳在我身上數到第幾階？', hint:'通往教室最常跑的那段樓梯。' },
    { id:'s4', key:'r2w6', stamp:'榜', name:'榜單牆', riddle:'段考成績、社團招生、失物招領，我全都替妳們貼過。', hint:'穿堂附近的公布欄。' },
    { id:'s5', key:'h5n1', stamp:'福', name:'下課十分鐘的終點', riddle:'鐘一響就有人朝我衝刺。熱狗、麵包和飲料，晚到就沒了。', hint:'買零食的地方。' }
  ],
  // 開場與結尾劇情：一個 { } 是一頁；icon 用貼紙代號（bell、letter、camera、book、heart、spark、star、cap…）；{name} 會換成玩家的稱呼
  story: {
    intro: [
      { icon:'bell', text:'今天的雄女，\n和妳記得的有一點不一樣。' },
      { icon:'book', text:'校園裡有五個地方，\n偷偷收著妳們那幾年留下的東西：\n鐘聲、樹影、跑過的階梯……' },
      { icon:'letter', text:'它們一直在等，\n想再見一次當年的妳們。' },
      { icon:'camera', text:'找到它們，\n拍一張現在的妳，\n留一句話給它們。' },
      { icon:'star', text:'不想入鏡也沒關係。\n當一次攝影師，\n拍下妳心中它最美的樣子。' },
      { icon:'spark', text:'五個地方都說完話，\n今晚的邀請函\n就會交到妳手上。' }
    ],
    introEnd: '好，開始吧',
    ending: [
      { icon:'heart', text:'鐘聲、老樹、階梯、榜單、福利社，\n都記住現在的妳了。' },
      { icon:'camera', text:'妳拍下的照片和留下的話，\n今晚會一起出現在聚餐現場。' },
      { icon:'letter', text:'{name}，\n歡迎回家。' }
    ],
    endingEnd: '打開邀請函'
  },
  // 聲音檔（選填）：放 mp3 的網址或同資料夾的檔名，例如 'audio/bgm.mp3'；留空就用內建合成的聲音
  audio: { bgm:'', shutter:'', stamp:'', fanfare:'' },
  // 後端：到 Supabase 專案的 Project Settings → API，複製 Project URL 和 anon public key 填進來；留空就用「模擬伺服器」
  supabase: { url:'', anonKey:'' },
  // 照片壓縮：上傳前在手機上壓到 maxBytes 以下；thumbWidth 是手機裡保留的小圖寬度

/* ===================== 上傳系統：壓縮 → 先存手機 → 背景自動上傳 =====================
   1. 照片在手機上壓到 CONFIG.upload.maxBytes 以下才上傳
   2. 送出時先存進手機（IndexedDB 的待上傳區），集章立刻成立，不用等網路
   3. 背景依序上傳；失敗就等一下再試（3 秒、6 秒、12 秒……最多 1 分鐘），網路恢復時立刻重試
   4. 後端：CONFIG.supabase 填好就連 Supabase；沒填就用「模擬伺服器」（資料存在這支手機） */

/* 手機裡的資料庫 */
const IDB={ db:null, mem:{ outbox:new Map(), mock:new Map() }, broken:false,
  open(){
    if(this.db || this.broken) return Promise.resolve(this.db);
    return new Promise(res=>{
      try{
        const r=indexedDB.open('kghs_hunt',1);
        r.onupgradeneeded=()=>{ const d=r.result; ['outbox','mock'].forEach(n=>{ if(!d.objectStoreNames.contains(n)) d.createObjectStore(n,{keyPath:'id'}); }); };
        r.onsuccess=()=>{ this.db=r.result; res(this.db); };
        r.onerror=()=>{ this.broken=true; res(null); };
      }catch(e){ this.broken=true; res(null); }
    });
  },
  async run(store,mode,fn){
    const d=await this.open();
    if(!d){ return fn(null, this.mem[store]); }
    return new Promise((res,rej)=>{ const t=d.transaction(store,mode), rq=fn(t.objectStore(store)); t.oncomplete=()=>res(rq && rq.result); t.onerror=()=>rej(t.error); });
  },
  put(st,v){ return this.run(st,'readwrite',(s,m)=> s ? s.put(v) : m.set(v.id,v)); },
  get(st,k){ return this.run(st,'readonly',(s,m)=> s ? s.get(k) : m.get(k)); },
  del(st,k){ return this.run(st,'readwrite',(s,m)=> s ? s.delete(k) : m.delete(k)); },
  all(st){ return this.run(st,'readonly',(s,m)=> s ? s.getAll() : [...m.values()]); },
  clear(st){ return this.run(st,'readwrite',(s,m)=> s ? s.clear() : m.clear()); }
};

/* 壓縮 */
function toBlob(c,q,type='image/jpeg'){ return new Promise(r=>{ try{ c.toBlob(b=>r(b),type,q); }catch(e){ r(null); } }); }
async function compressCanvas(canvas){
  const C=CONFIG.upload; let src=canvas, q=.86, b=await toBlob(src,q), guard=0;
  while(b && b.size>C.maxBytes && guard++<12){
    if(q-.08>=C.minQuality) q-=.08;
    else { const s=document.createElement('canvas'); s.width=Math.round(src.width*.85); s.height=Math.round(src.height*.85); s.getContext('2d').drawImage(src,0,0,s.width,s.height); src=s; q=.8; }
    b=await toBlob(src,q);
  }
  return b;
}
function thumbOf(canvas,w=CONFIG.upload.thumbWidth){
  const s=document.createElement('canvas'); s.width=w; s.height=Math.round(canvas.height*w/canvas.width);
  s.getContext('2d').drawImage(canvas,0,0,s.width,s.height); return s.toDataURL('image/jpeg',.72);
}

/* 後端介面：模擬版與 Supabase 版用同一組函式 */
const DEV={ offline:false };
try{ DEV.offline = sessionStorage.getItem('kghs_offline')==='1'; }catch(_){}
class NetError extends Error{}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new NetError('無法載入 '+src)); document.head.appendChild(s); }); }
let SBC=null;
async function sbClient(){
  if(SBC) return SBC;
  if(!window.supabase) await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js');
  SBC=window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey, { auth:{ persistSession:false } });
  return SBC;
}
function chk(r){ if(r.error){ const st=r.error.status||r.error.statusCode; const e=(!st || +st>=500) ? new NetError(r.error.message) : new Error(r.error.message); throw e; } return r.data; }
const API={
  get live(){ return !!(CONFIG.supabase.url && CONFIG.supabase.anonKey); },
  async gate(){ if(!navigator.onLine) throw new NetError('offline'); if(!this.live){ if(DEV.offline) throw new NetError('模擬斷線'); await sleep(300+Math.random()*500); } },
  async registerPlayer(p){
    await this.gate();
    if(this.live){ const c=await sbClient(); const d=chk(await c.rpc('register_player',{ p_key:p.key, p_name:p.name, p_cls:p.cls, p_l3:p.l3, p_code:p.code })); return d[0]; }
    const k='p:'+p.key, ex=await IDB.get('mock',k); if(ex) return { uid:ex.uid, code:ex.code };
    const uid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    await IDB.put('mock',{ id:k, uid, ...p }); return { uid, code:p.code };
  },
  async findPlayer(key){
    await this.gate();
    if(this.live){
      const c=await sbClient(); const d=chk(await c.rpc('find_player',{ p_key:key })); if(!d) return null;
      const url=path=>path ? c.storage.from('photos').getPublicUrl(path).data.publicUrl : null;
      d.entries=(d.entries||[]).map(e=>({ ...e, photo_url:url(e.photo_path)+'?v='+Date.parse(e.updated_at), hand_url:e.hand_path ? url(e.hand_path)+'?v='+Date.parse(e.updated_at) : null }));
      return d;
    }
    const p=await IDB.get('mock','p:'+key); if(!p) return null;
    const es=(await IDB.all('mock')).filter(x=>x.id.startsWith('e:'+p.uid+'|'));
    return { ...p, entries:es.map(e=>({ spot_id:e.spot, msg:e.msg, kind:e.kind, title:e.title, layout:e.layout, updated_at:e.t, photo_url:URL.createObjectURL(e.photo), hand_url:e.hand?URL.createObjectURL(e.hand):null })) };
  },
  async uploadEntry(it,uid){
    await this.gate();
    if(this.live){
      const c=await sbClient(), base=`${uid}/${it.spot}`;
      chk(await c.storage.from('photos').upload(base+'.jpg', it.photo, { upsert:true, contentType:'image/jpeg', cacheControl:'60' }));
      if(it.hand) chk(await c.storage.from('photos').upload(base+'-hand.png', it.hand, { upsert:true, contentType:'image/png', cacheControl:'60' }));
      chk(await c.from('entries').upsert({ id:`${uid}|${it.spot}`, player_uid:uid, spot_id:it.spot, name:it.name, cls:it.cls, msg:it.msg||'', kind:it.photoKind||'selfie', title:it.title||'',
        photo_path:base+'.jpg', hand_path:it.hand ? base+'-hand.png' : null, layout:it.layout, updated_at:new Date(it.t).toISOString() }));
      return;
    }
    await IDB.put('mock',{ id:`e:${uid}|${it.spot}`, spot:it.spot, name:it.name, cls:it.cls, msg:it.msg, kind:it.photoKind||'selfie', title:it.title||'', layout:it.layout, photo:it.photo, hand:it.hand, t:it.t });
  },
  async listEntries(){
    if(this.live){
      const c=await sbClient(); const d=chk(await c.from('entries').select('*').order('updated_at',{ascending:false}));
      const url=path=>c.storage.from('photos').getPublicUrl(path).data.publicUrl;
      return d.map(e=>({ name:e.name, cls:e.cls, spot:e.spot_id, msg:e.msg, kind:e.kind||'selfie', title:e.title||'', t:Date.parse(e.updated_at), img:url(e.photo_path)+'?v='+Date.parse(e.updated_at), hand:e.hand_path ? url(e.hand_path)+'?v='+Date.parse(e.updated_at) : null }));
    }
    return (await IDB.all('mock')).filter(x=>x.id.startsWith('e:')).sort((a,b)=>b.t-a.t)
      .map(e=>({ name:e.name, cls:e.cls, spot:e.spot, msg:e.msg, kind:e.kind||'selfie', title:e.title||'', t:e.t, img:URL.createObjectURL(e.photo), hand:e.hand?URL.createObjectURL(e.hand):null }));
  }
};

/* 待上傳佇列 */
const SYNC={ busy:false, timer:null, fails:0, pending:0 };
async function enqueue(item){ await IDB.put('outbox',item); await refreshPending(); processOutbox(); }
async function refreshPending(){ SYNC.pending=(await IDB.all('outbox')).length; syncBanner(); }
function markEntry(key,spot,t,state){
  const pl=DB.players[key]; const d=pl && pl.done[spot];
  if(d && (t===undefined || d.t===t)){ d.sync=state; save(); if(S===pl && !$('#home').hidden) renderHome(); }
}
async function processOutbox(){
  if(SYNC.busy) return; SYNC.busy=true; clearTimeout(SYNC.timer);
  try{
    const items=(await IDB.all('outbox')).sort((a,b)=>(a.kind==='player'?0:1)-(b.kind==='player'?0:1) || a.t-b.t);
    for(const it of items){
      try{
        if(it.kind==='player'){
          const r=await API.registerPlayer(it.player);
          const pl=DB.players[it.key];
          if(pl){ pl.player.uid=r.uid; pl.player.code=r.code; save(); mergeRemote(it.key); }
        } else {
          const pl=DB.players[it.key];
          if(!pl || !pl.player.uid){ throw new NetError('玩家還沒註冊完成'); }
          markEntry(it.key,it.spot,it.t,'sending');
          await API.uploadEntry(it, pl.player.uid);
          markEntry(it.key,it.spot,it.t,'sent');
        }
        await IDB.del('outbox',it.id); SYNC.fails=0;
      }catch(e){
        it.tries=(it.tries||0)+1; it.lastError=String(e && e.message || e);
        if(!(e instanceof NetError) && it.tries>=3){
          // 不是網路問題、試了 3 次還是被拒絕：保留在手機，標記失敗，不再卡住後面的資料
          if(it.kind==='entry') markEntry(it.key,it.spot,it.t,'failed');
          it.dead=true; await IDB.del('outbox',it.id); await IDB.put('mock',{ ...it, id:'dead:'+it.id });
          continue;
        }
        if(it.kind==='entry') markEntry(it.key,it.spot,it.t,'queued');
        await IDB.put('outbox',it); SYNC.fails++; break;
      }
    }
  } finally {
    SYNC.busy=false; await refreshPending();
    if(SYNC.pending>0){ const delay=Math.min(60000, 3000*Math.pow(2,Math.min(SYNC.fails,5))); SYNC.timer=setTimeout(processOutbox, delay); }
  }
}
async function mergeRemote(key){

function drawPattern(c,p,W,H){

  if(p==='hearts'){ c.fillStyle='rgba(255,255,255,.55)'; for(let y=30,r=0;y<H+30;y+=70,r++) for(let x=r%2?65:30;x<W+30;x+=70){ heartPath(c,x,y,11); c.fill(); } }
  if(p==='check'){ c.fillStyle='rgba(255,255,255,.45)'; for(let y=0,r=0;y<H;y+=40,r++) for(let x=r%2?40:0;x<W;x+=80) c.fillRect(x,y,40,40); }

  if(p==='stripes'){ c.strokeStyle='rgba(255,255,255,.5)'; c.lineWidth=18; for(let d=-H;d<W+H;d+=52){ c.beginPath(); c.moveTo(d,0); c.lineTo(d+H,H); c.stroke(); } }
  if(p==='stars'){ let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; }; c.fillStyle='rgba(255,255,255,.8)';
    for(let i=0;i<Math.round(W*H/9000);i++){ const x=rnd()*W, y=rnd()*H, r=1.5+rnd()*3.5; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); } }

function makeLace(lay){
  const c=document.createElement('canvas'); c.width=lay.W; c.height=lay.H;
  const g=c.getContext('2d'), r=Math.round(lay.W*0.016), pts=[];
  const edge=(x1,y1,x2,y2)=>{ const n=Math.max(2,Math.round(Math.hypot(x2-x1,y2-y1)/(r*1.9))); for(let i=0;i<=n;i++) pts.push([x1+(x2-x1)*i/n, y1+(y2-y1)*i/n]); };
  lay.cells.forEach(([x,y,w,h])=>{ edge(x,y,x+w,y); edge(x,y+h,x+w,y+h); edge(x,y,x,y+h); edge(x+w,y,x+w,y+h); });
  g.fillStyle='#FFFFFF'; pts.forEach(([x,y])=>{ g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill(); });
  g.fillStyle='#F8C9D6'; pts.forEach(([x,y])=>{ g.beginPath(); g.arc(x,y,r*0.32,0,Math.PI*2); g.fill(); });
  return c;
}
const OVERLAYS={};

function getOverlay(fk,lk){
  const f=FRAMES[fk]; if(!f.overlay) return null;
  const key=fk+'|'+lk; if(OVERLAYS[key]) return OVERLAYS[key];
  let ov;
  if(f.overlay==='lace') ov=makeLace(LAYOUTS[lk]);
  else { const src=typeof f.overlay==='string' ? f.overlay : f.overlay[lk]; if(!src) return null; ov=new Image(); ov.onload=()=>draw(); ov.src=src; }
  return OVERLAYS[key]=ov;
}
function applyFilter(src,f){
  const c=document.createElement('canvas'); c.width=src.width; c.height=src.height;
  const g=c.getContext('2d'); g.drawImage(src,0,0);
  if(f==='none') return c;
  const d=g.getImageData(0,0,c.width,c.height), a=d.data;
  let lift=0, sat=1, dr=0, dg=0, db=0;
  if(f==='milk'){ lift=.12; sat=.9; dr=8; dg=4; db=0; }
  if(f==='peach'){ lift=.08; sat=1.04; dr=14; dg=2; db=6; }
  if(f==='mono'){ lift=.06; sat=0; }
  for(let i=0;i<a.length;i+=4){
    let r=a[i], gg=a[i+1], b=a[i+2]; const l=.3*r+.59*gg+.11*b;
    r=l+(r-l)*sat; gg=l+(gg-l)*sat; b=l+(b-l)*sat;
    a[i]=r*(1-lift)+255*lift+dr; a[i+1]=gg*(1-lift)+255*lift+dg; a[i+2]=b*(1-lift)+255*lift+db;
  }
  g.putImageData(d,0,0); return c;
}

function wrapLines(c,text,maxW){
  const lines=[]; let line='';
  for(const ch of text){ if(ch==='\n'){ lines.push(line); line=''; continue; } const t=line+ch; if(c.measureText(t).width>maxW && line){ lines.push(line); line=ch; } else line=t; }
  if(line) lines.push(line); return lines;
}
function fitText(c,text,maxW,maxH,big,small,font){
  for(let s=big;s>=small;s-=2){ c.font=`400 ${s}px ${font}`; const ls=wrapLines(c,text,maxW); if(ls.length*s*1.3<=maxH) return {s,ls}; }
  c.font=`400 ${small}px ${font}`; return {s:small, ls:wrapLines(c,text,maxW)};
}
function strokePath(c,sk,outline){
  if(!sk.pts.length) return;
  c.save(); c.lineCap='round'; c.lineJoin='round';
  c.beginPath(); c.moveTo(sk.pts[0].x,sk.pts[0].y);
  if(sk.pts.length===1) c.lineTo(sk.pts[0].x+.1,sk.pts[0].y);
  sk.pts.forEach(q=>c.lineTo(q.x,q.y));
  if(outline){ c.strokeStyle='#FFFFFF'; c.lineWidth=sk.w+outline; c.stroke(); }
  else { c.shadowColor='rgba(0,0,0,.18)'; c.shadowBlur=4; }
  c.strokeStyle=sk.c; c.lineWidth=sk.w; c.stroke(); c.restore();
}
function drawWord(c,st){
  const s=WSTYLE[st.st], fs=st.base*0.3;
  c.font=`700 ${fs}px ${GF}`;
  const w=c.measureText(st.v).width+fs*1.1, h=fs*1.5, o=fs*0.14;
  c.shadowColor='rgba(60,40,70,.22)'; c.shadowBlur=10; c.shadowOffsetY=4;
  c.fillStyle='#FFFFFF';
  if(s.tail){ c.beginPath(); c.moveTo(-w*0.3,h/2-4); c.lineTo(-w*0.38,h/2+fs*0.5+o); c.lineTo(-w*0.12,h/2-4); c.closePath(); c.fill(); }
  rr(c,-w/2-o,-h/2-o,w+o*2,h+o*2,(h+o*2)/2); c.fill();
  c.shadowColor='rgba(0,0,0,0)';
  if(s.tail){ c.fillStyle=s.bg; c.strokeStyle=s.line; c.lineWidth=4; c.beginPath(); c.moveTo(-w*0.3,h/2-6); c.lineTo(-w*0.36,h/2+fs*0.4); c.lineTo(-w*0.14,h/2-6); c.closePath(); c.fill(); c.stroke(); }
  c.fillStyle=s.bg; rr(c,-w/2,-h/2,w,h,h/2); c.fill();
  if(s.line){ c.lineWidth=4; c.strokeStyle=s.line; c.stroke(); }
  c.fillStyle=s.fg; c.textAlign='center'; c.textBaseline='middle'; c.fillText(st.v,0,fs*0.05);
  st.hw=w/2+o; st.hh=h/2+o;
}
function drawNote(c,st){
  const w=st.base, fs=w*0.12, pad=w*0.1;
  c.font=`400 ${fs}px ${HF}`;
  const lines=wrapLines(c, E.msg.trim() || '在這裡寫留言', w-pad*2).slice(0,6);
  const h=Math.max(w*0.6, lines.length*fs*1.35+pad*2);
  c.shadowColor='rgba(60,40,70,.25)'; c.shadowBlur=14; c.shadowOffsetY=6;
  c.fillStyle='#FFF4B5'; c.fillRect(-w/2,-h/2,w,h);
  c.shadowColor='rgba(0,0,0,0)';
  c.fillStyle='rgba(255,143,171,.75)'; c.save(); c.rotate(-0.05); c.fillRect(-w*0.18,-h/2-fs*0.6,w*0.36,fs*1.2); c.restore();
  c.fillStyle='#4A3F55'; c.textAlign='center'; c.textBaseline='middle';
  const top=-(lines.length-1)*fs*1.35/2;
  lines.forEach((ln,i)=>c.fillText(ln,0,top+i*fs*1.35));
  st.hw=w/2; st.hh=h/2;
}
function setCellImage(i,src){
  const max=1600, sw=src.naturalWidth||src.videoWidth||src.width, sh=src.naturalHeight||src.videoHeight||src.height;
  const k=Math.min(1,max/Math.max(sw,sh));
  const raw=document.createElement('canvas'); raw.width=Math.round(sw*k); raw.height=Math.round(sh*k);
  raw.getContext('2d').drawImage(src,0,0,raw.width,raw.height);
  E.cells[i]={ raw, img:applyFilter(raw,E.filter), zoom:1, ox:0, oy:0 };
}
function setFilter(f){ E.filter=f; E.cells.forEach(c=>{ if(c.raw) c.img=applyFilter(c.raw,f); }); syncUI(); draw(); }
function loadImgFile(f){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src=URL.createObjectURL(f); }); }
function tplPreview(t){
  const f=FRAMES[t.frame]||FRAMES.berry;
  const bits=t.items.map(it=> it.k ? `<img src="${stickerUri(it.k)}" alt="" style="left:${it.x*100}%;top:${it.y*100}%">`
    : `<span style="left:${it.x*100}%;top:${it.y*100}%;background:${WSTYLE[it.st].bg};color:${WSTYLE[it.st].fg}">${esc(it.w)}</span>`).join('');
  return `<div class="pv" style="background:${f.bg}"><div class="hole"></div>${bits}</div>`;
}
function handImage(){
  if(!E.hand.length) return null;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  E.hand.forEach(sk=>sk.pts.forEach(q=>{ x0=Math.min(x0,q.x); y0=Math.min(y0,q.y); x1=Math.max(x1,q.x); y1=Math.max(y1,q.y); }));
  const m=24, c=document.createElement('canvas'); c.width=Math.max(40,x1-x0+m*2); c.height=Math.max(40,y1-y0+m*2);
  const g=c.getContext('2d'); g.translate(m-x0, m-y0);
  E.hand.forEach(sk=>strokePath(g,sk,12));
  return c;
}
function draw(showSel=true){
  if(!E.spot) return;
  const lay=L(), Fm=FRAMES[E.frame], W=lay.W, H=lay.H, rad=Math.round(W*0.024);
  cx.clearRect(0,0,W,H); cx.fillStyle=Fm.bg; cx.fillRect(0,0,W,H); drawPattern(cx,Fm.pattern,W,H);
  lay.cells.forEach(([x,y,w,h],i)=>{
    const c=E.cells[i];
    cx.save(); rr(cx,x,y,w,h,rad); cx.clip();
    if(c && c.img){
      const iw=c.img.width, ih=c.img.height, sc=Math.max(w/iw,h/ih)*c.zoom, dw=iw*sc, dh=ih*sc;
      cx.drawImage(c.img, x+(w-dw)/2+c.ox, y+(h-dh)/2+c.oy, dw, dh);
    } else {
      cx.fillStyle=Fm.empty; cx.fillRect(x,y,w,h);
      cx.fillStyle=Fm.sub; cx.textAlign='center'; cx.textBaseline='middle';
      cx.font=`400 ${Math.round(Math.min(w,h)*0.12)}px ${HF}`;
      cx.fillText(lay.cells.length>1 ? `第 ${i+1} 張` : '照片會在這裡', x+w/2, y+h/2);
    }
    cx.restore();
  });
  const ov=getOverlay(E.frame,E.layout);
  if(ov && (ov.naturalWidth || ov.width)) cx.drawImage(ov,0,0,W,H);
  if(showSel && E.tool==='frame' && lay.cells.length>1){
    const [x,y,w,h]=lay.cells[E.cur];
    cx.save(); cx.setLineDash([18,12]); cx.lineWidth=6; cx.strokeStyle='#FF6F95'; rr(cx,x-7,y-7,w+14,h+14,rad+7); cx.stroke(); cx.restore();
  }
  if(E.caption && Fm.caption!==false){
    const capTop=Math.max(...lay.cells.map(c=>c[1]+c[3])), capH=H-capTop, mid=W/2;
    cx.textAlign='center'; cx.textBaseline='middle';
    const msgOnCap = E.msgMode==='type' && E.msgPlace==='caption' && E.msg.trim();
    const scene = E.kind==='scene', ttl = E.title.trim();
    if(scene && !msgOnCap){
      cx.fillStyle=Fm.ink; cx.font=`400 ${lay.cap[0]}px ${HF}`;
      const f=fitText(cx, ttl ? `《${ttl}》` : E.spot.name, W-120, lay.cap[0]*1.4, lay.cap[0], 26, HF);
      cx.font=`400 ${f.s}px ${HF}`; cx.fillText(f.ls[0], mid, capTop+capH*0.42);
      cx.fillStyle=Fm.sub; cx.font=`700 ${lay.cap[1]}px ${GF}`;
      cx.fillText(`攝影｜${S.player.name}  ♡  ${dateStr()}`, mid, capTop+capH*0.74);
    } else if(msgOnCap){
      cx.fillStyle=Fm.ink;
      const f=fitText(cx, E.msg.trim(), W-120, capH*0.62, lay.cap[0], 26, HF);
      const top=capTop+capH*0.08+f.s*0.65;
      f.ls.forEach((ln,i)=>cx.fillText(ln, mid, top+i*f.s*1.3));
      cx.fillStyle=Fm.sub; cx.font=`700 ${Math.round(lay.cap[1]*0.85)}px ${GF}`;
      cx.fillText(scene ? `${ttl?`《${ttl}》 `:''}攝影｜${S.player.name}  ♡  ${dateStr()}` : `${S.player.name}  ♡  ${E.spot.name}  ♡  ${dateStr()}`, mid, capTop+capH*0.84);
    } else {
      cx.fillStyle=Fm.ink; cx.font=`400 ${lay.cap[0]}px ${HF}`;
      const y1=capTop+capH*0.42; cx.fillText(E.spot.name, mid, y1);
      const tw=cx.measureText(E.spot.name).width, hs=lay.cap[0]*0.3;
      cx.fillStyle=Fm.sub; heartPath(cx,mid-tw/2-hs*2.2,y1,hs); cx.fill(); heartPath(cx,mid+tw/2+hs*2.2,y1,hs); cx.fill();
      cx.font=`700 ${lay.cap[1]}px ${GF}`;

async function startStream(){

  vid.srcObject=stream; vid.classList.toggle('mirror', facing==='user');

const fk=$('#fakeCam'), fkx=fk.getContext('2d'); fk.width=900; fk.height=1200;
function drawFake(t){
  const g=fkx, W=fk.width, H=fk.height, hue=(200+FAKE.shift*53)%360;

    g.fillStyle='rgba(255,255,255,.8)'; for(let r=0;r<5;r++) for(let k=0;k<3;k++) g.fillRect(W*(.13+k*.15),H*(.44+r*.1),W*.09,H*.06);
    g.fillStyle='#6E5A44'; g.fillRect(W*.75,H*.5,W*.05,H*.5);

function fakeLoop(t){ drawFake(t||0); FAKE.raf=requestAnimationFrame(fakeLoop); }
function startFake(){

function setLayout(k){

function snapTo(i){
  const src = FAKE.raf ? fk : vid;
  const snap=document.createElement('canvas'); snap.width=src.videoWidth||src.width; snap.height=src.videoHeight||src.height;
  snap.getContext('2d').drawImage(src,0,0); setCellImage(i,snap); if(FAKE.raf) FAKE.shift++; E.cells[i].mini=miniOf(snap);

async function shutter(){
  if(shooting) return;
  if(!stream && !FAKE.raf){ $('#camFail').hidden=false; return; }
  const n=L().cells.length; if(E.shotK>=n) E.shotK=0;
  const auto = n>1 && E.timer>0;
  shooting=true; $('#shutter').disabled=true; $('#camTip').hidden=true;
  try{
    do{
      if(E.timer>0){
        $('#shotInfo').textContent = n>1 ? `第 ${E.shotK+1} / ${n} 張` : '準備好囉';
        for(let t=E.timer;t>0;t--){ if(!shooting) return; $('#count').textContent=t; sfx.beep(t<=1); await sleep(1000); }
        $('#count').textContent='';
      }
      if(!shooting) return;
      snapTo(E.shotK); E.shotK++; renderProg(); syncCamThumb();
      if(auto && E.shotK<n){ $('#count').style.fontSize='3rem'; $('#count').textContent='換個姿勢！'; await sleep(1200); $('#count').style.fontSize=''; $('#count').textContent=''; }
    } while(auto && E.shotK<n && shooting);
  } finally { shooting=false; $('#shutter').disabled=false; $('#count').textContent=''; }
  if(E.shotK>=n) setTimeout(goEdit, 450); else syncCam();
}
function syncCamThumb(){ const last=E.cells.filter(c=>c.mini).pop(); if(last){ $('#galThumb').style.backgroundImage=`url(${last.mini})`; $('#galThumb').textContent=''; } }
async function handleFiles(files){
  const n=L().cells.length; let i = E.shotK<n ? E.shotK : 0;
  for(const f of [...files].slice(0,n-i)){
    const im=await loadImgFile(f);
    if(!im){ toast('有一張照片打不開，請換一張'); continue; }
    setCellImage(i,im); E.cells[i].mini=miniOf(E.cells[i].raw); i++;
  }
  E.shotK=i;
  if(E.shotK>=n){ goEdit(); return; }
  toast(`還差 ${n-E.shotK} 張，再拍或再選幾張`); syncCam();
}

/* 選取的貼紙：外框＋左上角刪除鈕＋右下角縮放旋轉鈕（大小固定，方便手指點） */
const cssK=()=>cv.width/Math.max(1,cv.getBoundingClientRect().width);
function corners(st){
  const co=Math.cos(st.r), si=Math.sin(st.r), f=(lx,ly)=>({ x:st.x+(lx*co-ly*si)*st.s, y:st.y+(lx*si+ly*co)*st.s });
  const pad=14/st.s;
  return { del:f(-st.hw-pad,-st.hh-pad), rot:f(st.hw+pad,st.hh+pad) };
}
function drawSticker(st,sel){
  const c=cx; c.save(); c.translate(st.x,st.y); c.rotate(st.r); c.scale(st.s,st.s);
  if(st.type==='img'){
    const im=STK_IMG[st.key], b=st.base;
    if(im && im.complete && im.naturalWidth){ c.shadowColor='rgba(60,40,70,.2)'; c.shadowBlur=12; c.shadowOffsetY=4; c.drawImage(im,-b/2,-b/2,b,b); c.shadowColor='rgba(0,0,0,0)'; }
    st.hw=st.hh=b*0.45;
  } else if(st.type==='hand'){
    const b=st.base, h=b*st.img.height/st.img.width;
    c.drawImage(st.img,-b/2,-h/2,b,h); st.hw=b/2; st.hh=h/2;
  } else if(st.type==='note') drawNote(c,st);
  else drawWord(c,st);
  if(sel){
    const pad=14/st.s, k=cssK(), hr=17*k/st.s;
    c.lineWidth=2.5*k/st.s; c.setLineDash([10*k/st.s,7*k/st.s]);
    c.strokeStyle='#FFFFFF'; c.strokeRect(-st.hw-pad,-st.hh-pad,(st.hw+pad)*2,(st.hh+pad)*2);
    c.lineDashOffset=8*k/st.s; c.strokeStyle='#F2668C'; c.strokeRect(-st.hw-pad,-st.hh-pad,(st.hw+pad)*2,(st.hh+pad)*2);
    c.setLineDash([]);
    const btn=(x,y,bg,fg,glyph)=>{ c.save(); c.translate(x,y); c.rotate(-st.r); c.fillStyle=bg; c.beginPath(); c.arc(0,0,hr,0,Math.PI*2); c.fill();
      c.lineWidth=2*k/st.s; c.strokeStyle='#fff'; c.stroke(); c.fillStyle=fg; c.font=`700 ${hr*1.3}px sans-serif`; c.textAlign='center'; c.textBaseline='middle'; c.fillText(glyph,0,hr*.08); c.restore(); };
    btn(-st.hw-pad,-st.hh-pad,'#F2668C','#fff','×');
    btn(st.hw+pad,st.hh+pad,'#fff','#F2668C','↻');
  }
  c.restore();
}

/* 觸控：塗鴉時畫畫；碰到貼紙的按鈕＝刪除／縮放旋轉；碰到貼紙＝移動；碰到照片＝移動照片；兩指＝縮放 */
const ptrs=new Map(); let gest=null;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
function pt(e,el=cv){ const b=el.getBoundingClientRect(); return { x:(e.clientX-b.left)*el.width/b.width, y:(e.clientY-b.top)*el.height/b.height }; }
function hit(st,p){ const dx=p.x-st.x, dy=p.y-st.y, co=Math.cos(-st.r), si=Math.sin(-st.r); const lx=(dx*co-dy*si)/st.s, ly=(dx*si+dy*co)/st.s; return Math.abs(lx)<=st.hw+16 && Math.abs(ly)<=st.hh+16; }
const cellAt=p=>L().cells.findIndex(([x,y,w,h])=>p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h);
cv.addEventListener('pointerdown', e=>{
  const p=pt(e); ptrs.set(e.pointerId,p);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if(ptrs.size===1){
    gest=null;
    if(penMode()){ E.strokes.push({ c:E.pen, w:E.penSize*L().W, pts:[p] }); gest={mode:'pen'}; draw(); return; }
    if(E.sel>=0){
      const st=E.stickers[E.sel], cn=corners(st), r=26*cssK();
      if(dist(p,cn.del)<r){ if(st.type==='note') E.msgPlace='none'; E.stickers.splice(E.sel,1); E.sel=-1; syncUI(); draw(); return; }
      if(dist(p,cn.rot)<r){ const ctr={x:st.x,y:st.y}; gest={mode:'rot',ctr,d0:dist(ctr,p),a0:ang(ctr,p),s0:st.s,r0:st.r}; return; }
    }
    let h=-1; for(let i=E.stickers.length-1;i>=0;i--){ if(hit(E.stickers[i],p)){ h=i; break; } }
    E.sel=h;
    if(h>=0){ const st=E.stickers[h]; gest={mode:'st',dx:p.x-st.x,dy:p.y-st.y}; }
    else { const ci=cellAt(p); if(ci>=0){ E.cur=ci; const c=E.cells[ci]; if(c.img) gest={mode:'cell',i:ci,sx:p.x-c.ox,sy:p.y-c.oy}; } }
  } else if(ptrs.size===2 && !(gest && gest.mode==='pen')){
    const [a,b]=[...ptrs.values()];
    if(E.sel>=0){ const st=E.stickers[E.sel]; gest={mode:'pinchSt',d0:dist(a,b),a0:ang(a,b),s0:st.s,r0:st.r}; }
    else if(E.cells[E.cur] && E.cells[E.cur].img){ gest={mode:'pinchCell',d0:dist(a,b),z0:E.cells[E.cur].zoom}; }
  }
  syncUI(); draw();
});

  if(!ptrs.has(e.pointerId)) return;

  if(gest.mode==='pen') E.strokes[E.strokes.length-1].pts.push(p);

  else if(gest.mode==='pinchSt' && ptrs.size>=2 && st){ const [a,b]=[...ptrs.values()]; st.s=Math.min(5,Math.max(.3,gest.s0*dist(a,b)/gest.d0)); st.r=gest.r0+ang(a,b)-gest.a0; }

});

/* ===================== 聲音：背景音樂＋音效 =====================
   預設全部用程式即時合成（不需要音樂檔）。
   之後如果有正式的音樂或音效檔，填進 CONFIG.audio，就會改播檔案。 */
const SND={ on:true, ctx:null, master:null, music:null, sfx:null, started:false, timer:null, next:0, idx:0, el:null, duck:false };
try{ SND.on = localStorage.getItem('kghs_sound')!=='0'; }catch(_){}
function ac(){
  if(SND.ctx) return SND.ctx;
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return null;
  const c=new C(); SND.ctx=c;
  SND.master=c.createGain(); SND.master.gain.value=SND.on?1:0; SND.master.connect(c.destination);
  SND.music=c.createGain(); SND.music.gain.value=.16; SND.music.connect(SND.master);
  SND.sfx=c.createGain(); SND.sfx.gain.value=.9; SND.sfx.connect(SND.master);
  return c;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone(f,t,d,{type='sine',vol=.3,dest,attack=.005}={}){
  const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+attack);
  g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(dest||SND.sfx); o.start(t); o.stop(t+d+.05);
}
function noise(t,d,{vol=.5,freq=3000,q=.8}={}){
  const c=ac(); if(!c) return;
  const len=Math.ceil(c.sampleRate*d), buf=c.createBuffer(1,len,c.sampleRate), ch=buf.getChannelData(0);
  for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
  const src=c.createBufferSource(), bp=c.createBiquadFilter(), g=c.createGain();
  src.buffer=buf; bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=q; g.gain.value=vol;
  src.connect(bp); bp.connect(g); g.connect(SND.sfx); src.start(t);
}
function playFile(url,vol=1){ try{ const a=new Audio(url); a.volume=SND.on?vol:0; if(SND.on) a.play().catch(()=>{}); }catch(_){} }

/* 音效 */
const sfx={
  shutter(){ if(CONFIG.audio.shutter) return playFile(CONFIG.audio.shutter); const c=ac(); if(!c) return; const t=c.currentTime;
    noise(t,.035,{vol:.9,freq:2600,q:1.2}); tone(180,t,.05,{type:'square',vol:.12});
    noise(t+.07,.06,{vol:.7,freq:1800,q:.9}); tone(120,t+.07,.06,{type:'square',vol:.1}); },
  beep(last){ const c=ac(); if(!c) return; tone(last?1320:880,c.currentTime,.14,{type:'sine',vol:.35}); },
  pop(){ const c=ac(); if(!c) return; const t=c.currentTime; const o=c.createOscillator(), g=c.createGain();
    o.frequency.setValueAtTime(420,t); o.frequency.exponentialRampToValueAtTime(980,t+.08);
    g.gain.setValueAtTime(.3,t); g.gain.exponentialRampToValueAtTime(.0001,t+.12); o.connect(g); g.connect(SND.sfx); o.start(t); o.stop(t+.15); },
  page(){ const c=ac(); if(!c) return; const t=c.currentTime; tone(mtof(84),t,.5,{type:'triangle',vol:.14}); tone(mtof(91),t+.07,.6,{type:'sine',vol:.1}); },
  stamp(){ if(CONFIG.audio.stamp) return playFile(CONFIG.audio.stamp); const c=ac(); if(!c) return; const t=c.currentTime;
    tone(150,t,.25,{type:'sine',vol:.6}); noise(t,.05,{vol:.4,freq:600,q:.7});
    [79,83,86,91].forEach((m,i)=>tone(mtof(m),t+.12+i*.08,.7,{type:'triangle',vol:.16})); },
  fanfare(){ if(CONFIG.audio.fanfare) return playFile(CONFIG.audio.fanfare); const c=ac(); if(!c) return; const t=c.currentTime;
    [72,76,79,84].forEach((m,i)=>tone(mtof(m),t+i*.13,.9,{type:'triangle',vol:.2}));
    [76,79,84,88].forEach(m=>tone(mtof(m),t+.6,1.6,{type:'sine',vol:.12})); }
};

/* 內建背景音樂：原創的音樂盒小曲，F 大調、8 小節循環 */
const BPM=92, BEAT=60/BPM;
const MELODY=[[72,1],[77,1],[81,1],[79,.5],[77,.5],[76,1],[74,1],[72,2],[74,1],[77,1],[81,1],[84,1],[82,1.5],[81,.5],[79,2],
              [77,1],[81,1],[84,1],[82,.5],[81,.5],[79,1],[77,1],[76,2],[74,1],[76,1],[77,1],[79,1],[77,3],[0,1]];
const BASS=[53,48,46,48,53,48,46,53];
function scheduleMusic(){
  const c=SND.ctx; if(!c) return;
  while(SND.next < c.currentTime+.4){
    const [m,b]=MELODY[SND.idx];
    if(m) { tone(mtof(m),SND.next,1.4,{type:'sine',vol:.5,dest:SND.music}); tone(mtof(m+12),SND.next,.5,{type:'triangle',vol:.08,dest:SND.music}); }
    // 每小節開頭與第三拍放低音
    const beatPos=MELODY.slice(0,SND.idx).reduce((a,x)=>a+x[1],0);
    if(beatPos%2===0){ const bar=Math.floor(beatPos/4)%8; tone(mtof(BASS[bar]),SND.next,1.6,{type:'sine',vol:.28,dest:SND.music,attack:.02}); }
    SND.next+=b*BEAT; SND.idx=(SND.idx+1)%MELODY.length;
  }
}
function startMusic(){
  if(SND.started || !SND.on) return;
  SND.started=true;
  if(CONFIG.audio.bgm){ SND.el=new Audio(CONFIG.audio.bgm); SND.el.loop=true; SND.el.volume=SND.duck?.12:.4; SND.el.play().catch(()=>{ SND.started=false; }); return; }
  const c=ac(); if(!c) return; SND.next=c.currentTime+.1; SND.idx=0;
  SND.timer=setInterval(scheduleMusic,60); scheduleMusic();
}
function stopMusic(){ clearInterval(SND.timer); SND.timer=null; SND.started=false; if(SND.el){ SND.el.pause(); SND.el=null; } }
function duckMusic(on){
  SND.duck=on;
  if(SND.music && SND.ctx) SND.music.gain.setTargetAtTime(on?.04:.16, SND.ctx.currentTime, .2);
  if(SND.el) SND.el.volume=on?.12:.4;
}
function setSound(on){
  SND.on=on; try{ localStorage.setItem('kghs_sound', on?'1':'0'); }catch(_){}
  if(SND.master && SND.ctx) SND.master.gain.setTargetAtTime(on?1:0, SND.ctx.currentTime, .05);
  if(on){ ac()?.resume?.(); startMusic(); } else stopMusic();
  $('#soundBtn').textContent = on ? '🔊 聲音開' : '🔇 聲音關';
  $('#soundBtn').setAttribute('aria-pressed', on);
}
/* 手機瀏覽器規定：要等使用者先碰一下畫面才能出聲 */
function unlockAudio(){ if(!SND.on) return; const c=ac(); c?.resume?.(); startMusic(); }
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev, unlockAudio, {passive:true}));
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden){ SND.ctx?.suspend?.(); SND.el?.pause(); }
  else if(SND.on){ SND.ctx?.resume?.(); SND.el?.play().catch(()=>{}); }
});
$('#soundBtn').addEventListener('click', ()=>setSound(!SND.on));
$('#soundBtn').textContent = SND.on ? '🔊 聲音開' : '🔇 聲音關'; $('#soundBtn').setAttribute('aria-pressed', SND.on);

async function submit(){

  S.scanned[spot]=true; save();
  enqueue({ id:`entry|${key}|${spot}`, kind:'entry', key, spot, photo, hand, msg, layout, photoKind:kind, title, name:S.player.name, cls:S.player.cls, t });
  justStamped=spot; const stamp=E.spot.stamp; E.spot=null;

}

function loadImg(src){ return new Promise(res=>{ const i=new Image(); if(/^https?:/.test(src)) i.crossOrigin='anonymous'; i.onload=()=>res(i); i.onerror=()=>res(null); i.src=src; }); }
function wrapText(c,text,x,y,maxW,lh){ let line=''; for(const ch of text){ const t=line+ch; if(c.measureText(t).width>maxW && line){ c.fillText(line,x,y); line=ch; y+=lh; } else line=t; } if(line) c.fillText(line,x,y); return y+lh; }

    if(im){ const s=Math.max(tw/im.width,th/im.height), dw=im.width*s, dh=im.height*s; g.drawImage(im,-dw/2,-dh/2,dw,dh); }
    else { g.fillStyle=['#FFD3DF','#E3DAFF','#FFF0B8','#D2F2E3','#D6E8FF'][i%5]; g.fillRect(-tw/2,-th/2,tw,th); g.fillStyle='#fff'; g.font=`400 64px ${HF}`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(spots[i].stamp,0,0); g.textAlign='left'; g.textBaseline='alphabetic'; }

  g.fillStyle='#F2668C'; g.font=`400 36px ${HF}`; g.fillText('入場碼',190,by+93);
  g.textAlign='right'; g.fillStyle='#3B3346'; g.font=`700 80px ${GF}`; g.fillText(`KG-${p.code}`,900,by+106);

/* ===================== 投影牆預覽（正式版另做 wall.html，讀資料庫裡所有人的照片） ===================== */
let wallTimer=null;
async function openWall(){
  show('wall'); clearInterval(wallTimer);
  $('#wallStage').innerHTML='<p class="wall-empty">讀取中…</p>';
  let items=[];
  try{ items=await API.listEntries(); }catch(e){ $('#wallStage').innerHTML='<p class="wall-empty">讀不到資料，請確認網路。</p>'; return; }
  const nameOf=id=>(spotById(id)||{}).name||'';
  if(!items.length){ $('#wallStage').innerHTML='<p class="wall-empty">還沒有照片。<br>校友集章完成的照片和留言，會輪流出現在這裡。</p>'; return; }
  let i=0;
  const step=()=>{ const it=items[i%items.length]; i++;
    $('#wallStage').innerHTML=`<figure class="wall-card"><img src="${it.img}" alt=""><figcaption>${it.hand?`<img class="wall-hand" src="${it.hand}" alt="手寫留言">`:(it.msg?`<p class="wall-msg">「${esc(it.msg)}」</p>`:'')}${it.kind==='scene'?`<p class="wall-by">📷 攝影作品${it.title?`《${esc(it.title)}》`:''}</p>`:''}<p class="wall-by">${it.kind==='scene'?'攝影｜':''}${esc(it.name)}　第 ${esc(it.cls)} 屆　攝於${esc(nameOf(it.spot))}</p></figcaption></figure>`; };
  step(); wallTimer=setInterval(step,6000);
}

/* ===================== 動作 ===================== */
document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='home'){ E.spot=null; backHome(); }
  if(a==='storynext') storyNext();
  if(a==='storyskip') storySkip();
  if(a==='intro') playStory('intro', backHome);
  if(a==='ending') playStory('ending', openInvite);
  if(a==='previewEnd') playStory('ending', openInvite);
  if(a==='previewInvite') openInvite();
  if(a==='shoot') openEditor(b.dataset.id);
  if(a==='invite') openInvite();
  if(a==='logout') logout();
  if(a==='sim'){ const s=spotById(b.dataset.id); scanSpot(s.id,s.key); }
  if(a==='wall') openWall();
  if(a==='exitwall'){ clearInterval(wallTimer); boot(); }
  if(a==='fakecam'){ FAKE.on=!FAKE.on; try{ sessionStorage.setItem('kghs_fakecam', FAKE.on?'1':'0'); }catch(_){} renderHome(); toast(FAKE.on?'之後拍照會直接用測試假相機':'已關閉測試假相機'); }
  if(a==='retry'){ SYNC.fails=0; processOutbox(); toast('重新上傳中…'); }
  if(a==='offline'){ DEV.offline=!DEV.offline; try{ sessionStorage.setItem('kghs_offline', DEV.offline?'1':'0'); }catch(_){} renderHome(); if(!DEV.offline){ SYNC.fails=0; processOutbox(); } }
  if(a==='reset'){
    if(!resetArmed){ resetArmed=true; renderHome(); setTimeout(()=>{ resetArmed=false; if(!$('#home').hidden) renderHome(); },4000); return; }
    resetArmed=false; DB={ current:null, players:{} }; S=null; try{ localStorage.removeItem(KEY); }catch(_){} IDB.clear('outbox'); IDB.clear('mock'); SYNC.pending=0;
    logout();
  }
});

fontsReady.then(()=>{ if(E.spot) draw(); });
refreshPending().then(()=>processOutbox());
const pv=params.get('preview');
if(params.get('wall')) openWall();
else if(pv==='intro') playStory('intro', boot);
else if(pv==='end') playStory('ending', openInvite);
else if(pv==='invite') openInvite();
else boot();
</script>
</body>
</html>
